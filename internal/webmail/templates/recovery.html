<!doctype html>
<html lang="en"{{with .Theme}} data-theme="{{.}}"{{end}}{{with .Palette}} data-palette="{{.}}"{{end}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="{{asset "favicon.svg"}}" type="image/svg+xml">
<title>{{.Title}} · Elemta Mail</title>
<link rel="stylesheet" href="{{asset "tidewater.css"}}">
</head>
<body class="login-body">
<main class="login">
  {{template "logo-art" .}}
  <h1 class="login-title">{{.Title}}</h1>
  {{if .Notice}}<p class="notice" role="status">{{.Notice}}</p>{{end}}
  {{if .Problem}}<p class="problem" role="alert">{{.Problem}}</p>{{end}}
  {{if .Action}}
  <form action="{{.Action}}" method="post">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    {{if .Token}}
    <input type="hidden" name="token" value="{{.Token}}">
    {{if .Reset}}
    <label for="new">New password</label><input id="new" name="new" type="password" autocomplete="new-password" minlength="{{.Min}}" required>
    <label for="confirm">Repeat new password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="{{.Min}}" required>
    <button class="button primary block" type="submit">Reset password</button>
    {{else}}<button class="button primary block" type="submit">Verify recovery email</button>{{end}}
    {{else}}
    <label for="user">Mailbox email address</label><input id="user" name="user" type="email" autocomplete="username" required>
    <button class="button primary block" type="submit">Send reset link</button>
    {{end}}
  </form>
  {{end}}
  <p class="login-links"><a href="/login">Back to sign in</a></p>
</main>
{{template "login-footer"}}
</body>
</html>
