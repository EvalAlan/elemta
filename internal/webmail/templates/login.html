<!doctype html>
<html lang="en"{{with .Theme}} data-theme="{{.}}"{{end}}{{with .Palette}} data-palette="{{.}}"{{end}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Elemta Mail</title>
<link rel="stylesheet" href="{{asset "tidewater.css"}}">
<script src="{{asset "login.js"}}" defer></script>
</head>
<body class="login-body">
<main class="login">
  {{template "logo-art" .}}
  <h1 class="login-title">Sign in to your mail</h1>
  {{if .Notice}}<p class="notice" role="status">{{.Notice}}</p>{{end}}
  {{if .Problem}}<p class="problem" role="alert">{{.Problem}}</p>{{end}}
  <form action="/login" method="post" data-login>
    <input type="hidden" name="token" value="{{.Token}}">
    <label for="user">Email address</label>
    <input id="user" name="user" type="text" value="{{.User}}" autocomplete="username" autocapitalize="off" spellcheck="false" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="button primary block" type="submit">{{template "icon-signin"}}Sign in</button>
  </form>
  {{if .Recovery}}<p class="login-links"><a href="/forgot-password">Forgot password?</a></p>{{end}}
</main>
{{template "login-footer"}}
</body>
</html>
