<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Elemta MTA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #252525;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;
            --border-color: #333333;
            --accent-primary: #3b82f6;
            --accent-primary-hover: #2563eb;
            --accent-danger: #ef4444;
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.5);
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.6;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }

        .login-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-lg);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo {
            width: 280px;
            height: 280px;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 1rem;
            transition: border-color 0.15s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
            width: 100%;
            justify-content: center;
        }

        .btn-primary:hover {
            background: var(--accent-primary-hover);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .form-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--accent-danger);
            color: var(--accent-danger);
            padding: 0.75rem;
            border-radius: var(--radius-md);
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
        }

        .form-success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            color: #22c55e;
            padding: 0.75rem;
            border-radius: var(--radius-md);
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top: 2px solid currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .footer a {
            color: inherit;
        }

        .default-hint {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .default-hint strong {
            color: var(--text-primary);
        }
        [hidden] { display: none !important; }
        .btn-passkey, .btn-link { width: 100%; margin-top: 0.75rem; }
        .btn-link { background: none; border: none; color: var(--text-secondary); text-decoration: underline; cursor: pointer; }
        .second-intro { color: var(--text-secondary); margin-bottom: 1rem; }
        #second-error { display: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="logo">
                    <img src="/logo.png" alt="Elemta Logo">
                </div>
                <p class="subtitle">High-Performance SMTP Server</p>
            </div>

            
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password">
                </div>

                <div class="form-error" id="error-message"></div>
                <div class="form-success" id="success-message"></div>

                <button type="submit" class="btn btn-primary" id="login-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                        <polyline points="10 17 15 12 10 7" />
                        <line x1="15" y1="12" x2="3" y2="12" />
                    </svg>
                    <span id="btn-text">Login</span>
                </button>
            </form>

            <button type="button" class="btn btn-secondary btn-passkey" id="passkey-btn" hidden>Sign in with a passkey</button>

            <form id="second-form" hidden>
                <p class="second-intro">Enter the code from your authenticator app, or one of your recovery codes.</p>
                <div class="form-group" id="code-group">
                    <label for="code">Code</label>
                    <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="24" placeholder="123456">
                </div>
                <div class="form-error" id="second-error"></div>
                <button type="submit" class="btn btn-primary" id="code-btn">Continue</button>
                <button type="button" class="btn btn-secondary btn-passkey" id="second-passkey-btn" hidden>Use a passkey instead</button>
                <button type="button" class="btn btn-link" id="restart-btn">Start again</button>
            </form>
        </div>

        <div class="footer">
            <p><!-- elemta:notice --></p>
        </div>
    </div>

    <script>
        // Sign-in, in one or two steps: a password, then a code or a passkey
        // for users with two-step sign-in (internal/api/mfa.go). A passkey
        // alone also signs in.
        const passkeys = !!(window.PublicKeyCredential && window.isSecureContext);
        let pendingToken = '';

        const toBytes = s => {
            const b = atob(s.replace(/-/g, '+').replace(/_/g, '/'));
            const out = new Uint8Array(b.length);
            for (let i = 0; i < b.length; i++) out[i] = b.charCodeAt(i);
            return out.buffer;
        };
        const toText = buf => {
            const bytes = new Uint8Array(buf);
            let b = '';
            for (let i = 0; i < bytes.length; i++) b += String.fromCharCode(bytes[i]);
            return btoa(b).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        };

        async function post(url, body) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!response.ok) {
                const text = (await response.text()).trim();
                throw new Error(text || (response.status === 401 ? 'Invalid username or password' : 'Sign-in failed'));
            }
            return response.json();
        }

        function showError(id, text) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.style.display = text ? 'block' : 'none';
        }

        function signedIn(data) {
            const ok = document.getElementById('success-message');
            ok.textContent = `Welcome, ${data.username}! Redirecting...`;
            ok.style.display = 'block';
            setTimeout(() => { window.location.href = '/'; }, 500);
        }

        function secondStep(data) {
            pendingToken = data.token;
            document.getElementById('login-form').hidden = true;
            document.getElementById('passkey-btn').hidden = true;
            document.getElementById('second-form').hidden = false;
            const hasCode = data.methods.includes('totp');
            document.getElementById('code-group').hidden = !hasCode;
            document.getElementById('code-btn').hidden = !hasCode;
            document.querySelector('.second-intro').textContent = hasCode
                ? 'Enter the code from your authenticator app, or one of your recovery codes.'
                : 'Confirm it is you with your passkey.';
            document.getElementById('second-passkey-btn').hidden = !(passkeys && data.methods.includes('passkey'));
            document.getElementById('second-passkey-btn').textContent = hasCode ? 'Use a passkey instead' : 'Use my passkey';
            if (hasCode) document.getElementById('code').focus();
        }

        function restart() {
            pendingToken = '';
            document.getElementById('second-form').hidden = true;
            document.getElementById('login-form').hidden = false;
            document.getElementById('passkey-btn').hidden = !passkeys;
            document.getElementById('password').value = '';
            document.getElementById('code').value = '';
            showError('second-error', '');
            document.getElementById('password').focus();
        }

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('login-btn');
            const btnText = document.getElementById('btn-text');
            showError('error-message', '');
            document.getElementById('success-message').style.display = 'none';
            loginBtn.disabled = true;
            btnText.textContent = 'Signing in...';
            try {
                const data = await post('/auth/login', { username, password });
                if (data.status === 'second_factor') secondStep(data);
                else signedIn(data);
            } catch (error) {
                showError('error-message', error.message === 'Failed to fetch' ? 'Login failed. Server may be unavailable.' : error.message);
            } finally {
                loginBtn.disabled = false;
                btnText.textContent = 'Login';
            }
        }

        async function submitCode(event) {
            event.preventDefault();
            showError('second-error', '');
            const btn = document.getElementById('code-btn');
            btn.disabled = true;
            try {
                signedIn(await post('/auth/login/code', { token: pendingToken, code: document.getElementById('code').value }));
            } catch (error) {
                showError('second-error', error.message);
                if (/start again/i.test(error.message)) setTimeout(restart, 1500);
            } finally {
                btn.disabled = false;
            }
        }

        // With a token, the passkey is the second step after the password;
        // without, it signs in on its own.
        async function usePasskey(errorId) {
            showError(errorId, '');
            try {
                const begun = await post('/auth/login/passkey/begin', { token: pendingToken });
                const options = begun.options.publicKey;
                options.challenge = toBytes(options.challenge);
                (options.allowCredentials || []).forEach(c => { c.id = toBytes(c.id); });
                const cred = await navigator.credentials.get({ publicKey: options });
                signedIn(await post('/auth/login/passkey/finish', {
                    token: pendingToken, challenge: begun.challenge,
                    response: {
                        id: cred.id, rawId: toText(cred.rawId), type: cred.type,
                        response: {
                            clientDataJSON: toText(cred.response.clientDataJSON),
                            authenticatorData: toText(cred.response.authenticatorData),
                            signature: toText(cred.response.signature),
                            userHandle: cred.response.userHandle ? toText(cred.response.userHandle) : ''
                        }
                    }
                }));
            } catch (error) {
                // Dismissing the browser's prompt isn't a problem to report.
                if (error && error.name === 'NotAllowedError') return;
                showError(errorId, error && error.name && error.name !== 'Error' ? 'Your browser couldn\'t use a passkey here.' : error.message);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('second-form').addEventListener('submit', submitCode);
            document.getElementById('restart-btn').addEventListener('click', restart);
            document.getElementById('passkey-btn').addEventListener('click', () => usePasskey('error-message'));
            document.getElementById('second-passkey-btn').addEventListener('click', () => usePasskey('second-error'));
            document.getElementById('passkey-btn').hidden = !passkeys;
            document.getElementById('username').focus();
        });
    </script>
</body>
</html>
