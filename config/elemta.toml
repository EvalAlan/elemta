# Elemta SMTP Server Configuration

# Top-level configuration (used by SMTP server)
hostname = "mail.dev.evil-admin.com"
listen_addr = ":2525"
local_domains = ["example.com", "evil-admin.com", "localhost", "mail.example.com"]
max_size = 52428800  # 50MB

# Enforce RFC 5321 CRLF line endings in DATA (default: true).
# This is the primary defence against SMTP smuggling: a bare LF that this
# server treats as ordinary content may be read as a line terminator by a
# downstream server, letting an attacker inject extra messages.
# Set to false only if you must accept mail from legacy senders that emit
# bare LF, and understand that doing so re-opens that vector.
strict_line_endings = true

[server]
hostname = "mail.example.com"
listen = ":2525"  # Internal SMTP port (non-privileged)
listen_submission = ":587"  # Submission port for authenticated clients
max_size = 26214400  # 25MB
local_domains = ["example.com", "mail.example.com", "localhost"]
dev_mode = true  # Enable development mode for XDEBUG command

# TLS Configuration - disabled by default in container builds
# TLS certs/keys should be mounted and enabled via custom config in production.
[tls]
enabled = false
enable_starttls = false
cert_file = ""
key_file = ""

queue_dir = "/app/queue"

[queue]
dir = "/app/queue"
backend = "sqlite"
[queue.indexedfs]
index_path = "/app/queue/index"
content_dir = "/app/queue/data"
sync_mode = "normal"
recovery_on_startup = true

[queue.sqlite]
path = "/app/queue/queue.db"
busy_timeout_ms = 5000
journal_mode = "WAL"
synchronous = "NORMAL"

[queue.postgres]
dsn = "postgres://elemta:elemta@elemta-postgres:5432/elemta_queue?sslmode=disable"
max_open_conns = 20
max_idle_conns = 10
conn_max_lifetime_seconds = 1800

[logging]
type = "elastic"
level = "info"
format = "json"
output = "http://elemta-elasticsearch:9200"
options = { index = "elemta-logs", bufferSize = 50, flushInterval = "5s" }

[plugins]
directory = "/app/plugins"
enabled = []

[queue_processor]
enabled = true
interval = 10
workers = 5
debug = false

[auth] 
enabled = true
required = false
datasource_type = "ldap"
datasource_name = "ldap"
datasource_host = "elemta-ldap"
datasource_port = 389
datasource_user = "cn=admin,dc=example,dc=com"
datasource_pass = "admin"
datasource_db = "dc=example,dc=com"

[delivery]
mode = "lmtp"
host = "elemta-dovecot"
port = 2424
timeout = 30
retry_delay = 60

# Content scanning.
#
# These sections must name the sidecar containers explicitly. When the
# sections are absent the built-in defaults assume localhost, which is only
# correct if the scanners run inside this container — in this compose setup
# they do not, so scanning would silently fail to connect and every message
# would pass unscanned.
#
# reject_on_failure / reject_on_spam stay false so that a scanner outage
# degrades to delivering unscanned mail rather than refusing it.
# Mass mailer: bulk campaign sending from the web interface.
#
# Disabled by default — bulk mail should be turned on deliberately.
#
# default_rate_per_minute caps how fast a campaign hands messages to the queue
# when the campaign does not set its own rate. Campaign mail is queued at low
# priority so it cannot overtake ordinary transactional mail.
[mass_mailer]
enabled = false
default_rate_per_minute = 600
max_recipients = 0  # 0 = no limit

[antivirus]
enabled = true
reject_on_failure = false

[antivirus.clamav]
enabled = true
address = "elemta-clamav:3310"
timeout = 30
scan_limit = 26214400  # 25MB

[antispam]
enabled = true
reject_on_spam = false

[antispam.rspamd]
enabled = true
address = "http://elemta-rspamd:11333"
timeout = 30
scan_limit = 26214400  # 25MB
threshold = 6.0

# Rate Limiting Configuration - More permissive for testing
[rate_limiter]
enabled = true

# Connection limits - very permissive for testing
max_connections_per_ip = 1000
connection_rate_per_minute = 10000
connection_burst_size = 1000
connection_timeout = "30s"

# Message limits - reasonable for testing
max_messages_per_minute = 300
max_messages_per_hour = 10000
max_recipients_per_message = 100
max_recipients_per_hour = 50000

# Volume limits - generous for testing
max_message_size = "100MB"
max_data_per_hour = "10GB"
volume_burst_size = "500MB"
volume_rate_window = "5m"

# Authentication limits - prevent brute force but allow testing
max_auth_attempts_per_minute = 20
auth_lockout_duration = "5m"
auth_burst_size = 50

# Access lists - empty for testing
whitelist_ips = []
whitelist_domains = []
blacklist_ips = []
blacklist_domains = []

# Valkey backend - disabled for testing (use local rate limiting)
valkey_url = ""
valkey_key_prefix = "elemta:ratelimit:"

# Advanced settings
cache_size = 10000
cache_ttl = "1h"
cleanup_interval = "5m"
metrics_enabled = true
timeout = 30
max_retries = 3
retry_delay = 60

[memory]
max_memory_usage = 2147483648  # 2GB total memory limit
memory_warning_threshold = 0.75  # 75% warning threshold
memory_critical_threshold = 0.90  # 90% critical threshold
gc_threshold = 0.80  # 80% force garbage collection
monitoring_interval = 5  # Seconds
per_connection_memory_limit = 52428800  # 50MB per session (ELE-16 requirement)
max_goroutines = 2000
goroutine_leak_detection = true
memory_exhaustion_protection = true

[resources]
max_connections = 1000
max_connections_per_ip = 1000  # Very permissive for testing
connection_timeout = 30
session_timeout = 300
idle_timeout = 120
rate_limit_window = 60
max_requests_per_window = 100000  # Very permissive for testing
goroutine_pool_size = 100
circuit_breaker_enabled = true
resource_monitoring_enabled = true

[metrics]
enabled = true
listen_addr = ":8080"

# API Server Configuration
[api]
enabled = true
listen_addr = "127.0.0.1:8025"
web_root = "./web/static"
auth_enabled = false
auth_file = ""

# Rate Limiting Configuration for API endpoints
[api.rate_limit]
enabled = true
requests_per_second = 10.0  # Allow 10 requests per second per IP
burst = 20                   # Allow burst of 20 requests

# CORS Configuration for API
[api.cors]
enabled = true
allowed_origins = ["http://localhost:8025", "http://localhost:3000"]
allowed_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
allowed_headers = ["Content-Type", "Authorization"]
allow_credentials = true
max_age = 86400  # 24 hours
