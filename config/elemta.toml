# Elemta SMTP Server Configuration

# Top-level configuration (used by SMTP server)
hostname = "mail.dev.evil-admin.com"
listen_addr = ":2525"
local_domains = ["example.com", "evil-admin.com", "localhost", "mail.example.com"]
max_size = 52428800  # 50MB

# Outbound traffic shaping: how hard to push at one destination.
#
# Large receivers do not publish a rate — they tell you by deferring — so the
# per-destination rate limit below is off by default and the backoff does the
# work. A destination that returns a 4xx is left alone for a while, and only
# that destination; a message for one in backoff is deferred rather than held,
# so a slow receiver cannot stall the queue behind it.
# Concurrent deliveries to a single destination.
#
# Keep this at or above [queue_processor] workers. Below it, the surplus workers
# claim messages they cannot deliver and those are deferred with retry backoff
# rather than waiting for a slot — so the queue grows, the log fills with
# "domain X is over concurrent delivery limit", and the server looks like it is
# failing when it is obeying a limit. The dev stack delivers everything to one
# domain over LMTP, so that is the normal case here, not an edge case.
max_connections_per_domain = 20

# Enforce RFC 5321 CRLF line endings in DATA (default: true).
# This is the primary defence against SMTP smuggling: a bare LF that this
# server treats as ordinary content may be read as a line terminator by a
# downstream server, letting an attacker inject extra messages.
# Set to false only if you must accept mail from legacy senders that emit
# bare LF, and understand that doing so re-opens that vector.
strict_line_endings = true

[server]
hostname = "mail.example.com"
listen = ":2525"  # Internal SMTP port (non-privileged)
listen_submission = ":587"  # Submission port for authenticated clients
max_size = 26214400  # 25MB
local_domains = ["example.com", "mail.example.com", "localhost"]
dev_mode = true  # Enable development mode for XDEBUG command

# TLS Configuration - disabled by default in container builds
# TLS certs/keys should be mounted and enabled via custom config in production.
# TLS. The development stack ships a self-signed certificate that `make certs`
# generates with a deliberately short life — see CERT_DAYS in the Makefile — so
# the expiry warning on the Health page is exercised rather than being a code
# path nobody sees until a real certificate lapses.
#
# The paths point at the runtime directory, not the read-only config mount:
# a private key has to be 0600 and owned by the user that reads it, and a bind
# mount carries the host's ownership. scripts/prepare-config.sh stages it.
[tls]
enabled = true
enable_starttls = true
cert_file = "/app/runtime-config/test.crt"
key_file = "/app/runtime-config/test.key"

queue_dir = "/app/queue"

[queue]
dir = "/app/queue"
# The file backend is the default while the SQLite one is being reworked.
#
# SQLite is not wrong, but the queue it produced under sustained load testing
# was not something to benchmark against: enqueue tombstones stored whole
# message bodies and nothing pruned them, so the database reached 2.6GB — 93% of
# it dead tombstones — and every enqueue probed an index that never stopped
# growing. The leak is fixed (see internal/queue/tombstone.go), but any queue
# created before that fix still carries it, and the fix has not been measured
# under load yet. Switch back with QUEUE_BACKEND=sqlite, on a fresh queue.
backend = "file"

# Keep a copy of each delivered message so a rolled-back binary can still
# recognise a duplicate enqueue.
#
# Costs a full-size write on every successful delivery — measured at 2,243
# bytes per delivered message — and it is the single largest remaining cost on
# the delivery path. Setting it false roughly halves that write.
#
# The risk it covers: a binary rolled back to a build that predates the content
# digest reads only this copy. Finding it empty, it decides every retry
# conflicts and starts refusing mail. If your deployment cannot roll back that
# far, false is safe and faster. Tombstones are pruned after 24 hours either
# way, which bounds both the disk cost and how long a rollback could see them.
retain_tombstone_body = true
[queue.indexedfs]
index_path = "/app/queue/index"
content_dir = "/app/queue/data"
sync_mode = "normal"
recovery_on_startup = true

[queue.sqlite]
path = "/app/queue/queue.db"
busy_timeout_ms = 5000
journal_mode = "WAL"
synchronous = "NORMAL"

[queue.postgres]
dsn = "postgres://elemta:elemta@elemta-postgres:5432/elemta_queue?sslmode=disable"
max_open_conns = 20
max_idle_conns = 10
conn_max_lifetime_seconds = 1800

[logging]
level = "info"

[plugins]
directory = "/app/plugins"
enabled = []

[queue_processor]
enabled = true
# Seconds between queue sweeps.
#
# This is pickup latency, not throughput: the processor claims and delivers
# until the queue is empty, then waits for the next tick. At 10 seconds a
# message that arrives just after a sweep sits there for ten seconds doing
# nothing, and gaps of exactly 10,005ms were measured between claim cycles on
# an otherwise idle server.
#
# One second costs a directory scan per second on an idle queue, which is
# cheap, and removes the stall. It does not make a busy queue drain faster —
# that is bounded by the work per message, not by this.
interval = 1
# Measured on a clean file-backed queue draining a 20k backlog: 5 workers gave
# 21.0/s, 20 gave 23.4/s. Only +11% for 4x the workers, because workers are not
# what limits this — see the claiming note below — but it is free, so take it.
#
# An earlier measurement said 20 was *worse* than 5. That was taken against a
# SQLite queue whose tombstone table had grown to 2.6GB and was degrading as it
# ran; the control re-measured at the same setting drifted 56/s to 38/s, a
# noise floor wider than the effect being claimed. Do not trust a queue
# benchmark taken on a queue that is itself changing.
workers = 20
debug = false

[auth] 
enabled = true
required = false
datasource_type = "ldap"
datasource_name = "ldap"
datasource_host = "elemta-ldap"
datasource_port = 389
datasource_user = "cn=admin,dc=example,dc=com"
datasource_pass = "admin"
datasource_db = "dc=example,dc=com"

[delivery]
# Delivery goes to a real mailbox server, because a mail server that discards
# mail by default is a bad thing to hand someone.
#
# For throughput work this is the wrong destination: Dovecot's maildir writes
# and indexing cost ~100ms a message and saturate near 70/s, so a benchmark
# against it measures Dovecot. 'make sink-up' repoints delivery at a sink that
# absorbs ~4,500/s and therefore cannot be what is being measured;
# 'make sink-down' brings it back here. The sink container runs either way, so
# switching costs a restart and nothing else.
mode = "lmtp"
max_messages_per_minute_per_domain = 0  # 0 = no limit
host = "elemta-dovecot"
port = 2424
timeout = 30
retry_delay = 60

# Content scanning.
#
# These sections must name the sidecar containers explicitly. When the
# sections are absent the built-in defaults assume localhost, which is only
# correct if the scanners run inside this container — in this compose setup
# they do not, so scanning would silently fail to connect and every message
# would pass unscanned.
#
# reject_on_failure / reject_on_spam stay false so that a scanner outage
# degrades to delivering unscanned mail rather than refusing it.
# Access control: allow and deny lists applied before mail is accepted.
#
# Separate from trusted_networks, which decides how strictly a peer's content is
# validated. This decides whether the peer may connect at all, and whether a
# sender domain may be used.
#
# Allow beats deny, so a known-good host inside a denied range can be permitted
# without restating the range. Addresses may be CIDR ranges or single hosts.
# Domain rules cover subdomains, and the empty sender (bounces) is never refused.
[access_control]
enabled = true
allow_ips = []
deny_ips = []
allow_domains = []
deny_domains = []

# DNS blocklists (RBL/DNSBL) for the connecting address.
#
# Disabled by default and, when enabled, set to mark rather than refuse.
# Tagging first is what makes a new blocklist safe to try: the operator can see
# what it would have refused before letting it refuse anything.
#
# Checked at MAIL FROM rather than at connect, so an authenticated client is
# already known to be one. Authenticated senders are never looked up — a
# legitimate user on a hotel or mobile network whose address is listed would
# otherwise be unable to send at all.
#
# A resolver failure is treated as "not listed": failing closed would turn a
# DNS outage into a mail outage.
[rbl]
enabled = true
zones = ["zen.spamhaus.org"]
reject = false
timeout = 5
skip_ips = []
cache_ttl = 3600
cache_size = 10000

# Built-in mail authentication plugins.
#
# Writes an Authentication-Results header saying what was checked and what was
# found, whatever the outcome — a reader can then tell "nothing passed" from
# "never looked".
#
# enforce_dmarc is off. Honouring a domain's published policy is the point
# eventually, but the first thing enforcement does on a real server is reject
# mail from forwarders and mailing lists, which break SPF alignment by design.
# Watch the results first, then turn it on.
#
# Inconclusive checks resolve towards accepting: a DNS timeout is a temporary
# error, not a forgery, and refusing mail whenever a resolver hiccups would cost
# far more than it catches.
[plugins.spf]
enabled = true
timeout = 10

[plugins.dkim]
enabled = true
verify = true
sign = false
header_canonicalization = "relaxed"
body_canonicalization = "relaxed"
domains = []

[plugins.dmarc]
enabled = true
enforce = false
timeout = 10

# ARC (RFC 8617) lets each hop record, signed, what it saw — so a receiver can
# still see that authentication passed before a forwarder or mailing list broke
# SPF alignment and the DKIM signature. Verification needs no key and is on by
# default. Sealing signs mail this server relays and does need one, so it is off
# until a domain, selector and key are configured.
[plugins.arc]
enabled = true
verify = true
seal = false
header_canonicalization = "relaxed"
body_canonicalization = "relaxed"
headers_to_sign = ["From", "To", "Subject", "Date", "Message-ID"]
timeout = 10

# Mass mailer: bulk campaign sending from the web interface.
#
# Disabled by default — bulk mail should be turned on deliberately.
#
# default_rate_per_minute caps how fast a campaign hands messages to the queue
# when the campaign does not set its own rate. Campaign mail is queued at low
# priority so it cannot overtake ordinary transactional mail.
[mass_mailer]
enabled = true
default_rate_per_minute = 600
max_recipients = 0  # 0 = no limit

[antivirus]
enabled = true
reject_on_failure = false

[antivirus.clamav]
enabled = true
address = "elemta-clamav:3310"
timeout = 30
scan_limit = 26214400  # 25MB

[antispam]
enabled = true
# Refuse only what Rspamd itself calls a reject.
#
# Elemta honours Rspamd's action rather than re-deciding from the raw score, so
# this rejects the "reject" action only — currently score >= 15. Everything
# Rspamd merely tags is still delivered carrying its spam headers.
#
# This was false until the Bayes classifier was trained, and turning it on
# before that would have refused nearly all mail: untrained, the score was a
# sum of infrastructure penalties that put ordinary clean mail above the
# threshold. Trained, 0 of 61 real ham messages reach the reject action while
# GTUBE reaches it exactly. If you retrain, re-measure before trusting this.
reject_on_spam = true

[antispam.rspamd]
enabled = true
address = "http://elemta-rspamd:11333"
timeout = 30
scan_limit = 26214400  # 25MB
threshold = 6.0

# Rate Limiting Configuration - More permissive for testing
[rate_limiter]
enabled = true

# Connection limits - very permissive for testing
max_connections_per_ip = 1000
connection_rate_per_minute = 10000
connection_burst_size = 1000
connection_timeout = "30s"

# Message limits - reasonable for testing
max_messages_per_minute = 300
max_messages_per_hour = 10000
max_recipients_per_message = 100
max_recipients_per_hour = 50000

# Volume limits - generous for testing
max_message_size = "100MB"
max_data_per_hour = "10GB"
volume_burst_size = "500MB"
volume_rate_window = "5m"

# Authentication limits - prevent brute force but allow testing
max_auth_attempts_per_minute = 20
auth_lockout_duration = "5m"
auth_burst_size = 50

# Access lists - empty for testing
whitelist_ips = []
whitelist_domains = []
blacklist_ips = []
blacklist_domains = []

# Valkey backend - disabled for testing (use local rate limiting)
valkey_url = ""
valkey_key_prefix = "elemta:ratelimit:"

# Advanced settings
cache_size = 10000
cache_ttl = "1h"
cleanup_interval = "5m"
metrics_enabled = true
timeout = 30
max_retries = 3
retry_delay = 60

[memory]
max_memory_usage = 2147483648  # 2GB total memory limit
memory_warning_threshold = 0.75  # 75% warning threshold
memory_critical_threshold = 0.90  # 90% critical threshold
gc_threshold = 0.80  # 80% force garbage collection
monitoring_interval = 5  # Seconds
per_connection_memory_limit = 52428800  # 50MB per session (ELE-16 requirement)
max_goroutines = 2000
goroutine_leak_detection = true
memory_exhaustion_protection = true

[resources]
max_connections = 1000
max_connections_per_ip = 1000  # Very permissive for testing
connection_timeout = 30
session_timeout = 300
idle_timeout = 120
rate_limit_window = 60
max_requests_per_window = 100000  # Very permissive for testing
goroutine_pool_size = 100
circuit_breaker_enabled = true
resource_monitoring_enabled = true

[metrics]
enabled = true
listen_addr = ":8080"

# API Server Configuration
# The web interface and its API.
#
# auth_enabled is on. Every endpoint behind it can flush a queue, rewrite the
# configuration or send bulk mail, so an unauthenticated dashboard is an
# unauthenticated administrator — the "Guest" view was full access with a
# friendlier name.
#
# auth_file lives on the runtime volume because it has to be writable by the
# service and readable by nobody else; `elemta user add` creates it, and
# `make install-dev` bootstraps an admin account.
[api]
enabled = true
listen_addr = "127.0.0.1:8025"
web_root = "./web/static"
auth_enabled = true
auth_file = "/app/runtime-config/users.json"

# Rate Limiting Configuration for API endpoints
[api.rate_limit]
enabled = true
requests_per_second = 10.0  # Allow 10 requests per second per IP
burst = 20                   # Allow burst of 20 requests

# CORS Configuration for API
[api.cors]
enabled = true
allowed_origins = ["http://localhost:8025", "http://localhost:3000"]
allowed_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
allowed_headers = ["Content-Type", "Authorization"]
allow_credentials = true
max_age = 86400  # 24 hours
