name: Go Test

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-short:
    name: test (short)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run short test suite
        run: go test ./... -short

  test-full:
    name: test (full)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run full test suite
        run: go test ./...

  test-webmail-objects:
    name: test (webmail Postgres objects)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: objects
          POSTGRES_USER: objects
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U objects -d objects"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test object storage and migration
        env:
          ELEMTA_TEST_OBJECT_POSTGRES_DSN: host=127.0.0.1 port=5432 dbname=objects user=objects password=local-test-only sslmode=disable
        run: go test -race -run '^TestPostgresObjects$' -count=1 ./internal/webmail/

  test-webmail-browser:
    name: test (webmail in a browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The runner image ships Google Chrome; the tests find it on PATH.
      - name: Run browser tests
        run: go test -tags browser -run Browser -count=1 ./internal/webmail/

  test-queue-race:
    name: test (queue race)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run queue race tests
        run: go test ./internal/queue/... -race

  test-queue-sqlite:
    name: test (queue sqlite guardrails)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run sqlite guardrail tests
        run: go test ./internal/queue/... -run '^TestQueueSQLiteGuardrails_'

  test-smtp-race-smoke:
    name: test (smtp race smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run SMTP race smoke tests
        # The whole smtp package, not a filtered subset: a filter only catches
        # races in the tests it names, and the full package takes about 2.5
        # minutes under -race.
        run: |
          go test ./internal/smtp -race -count=1
          go test ./tests/integration -race -run 'TestIntegration_PersistentConnection|TestIntegration_TimeoutHandling'
