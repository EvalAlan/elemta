name: Docker Build

on:
  push:
    branches: [ main ]
    # A release tag publishes both images under the version as well.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # main publishes :latest and :<sha>; a vX.Y.Z tag publishes :vX.Y.Z
      # and :<sha>, and stamps the version into the binaries. Pull requests
      # build without pushing.
      - name: Compute image names and tags
        id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          version="$GITHUB_SHA"; label=latest
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; label="$GITHUB_REF_NAME"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "main<<EOF"; echo "$name:$label"; echo "$name:$GITHUB_SHA"; echo "EOF"
            echo "mailbox<<EOF"; echo "$name-mailbox:$label"; echo "$name-mailbox:$GITHUB_SHA"; echo "EOF"
            echo "ldap<<EOF"; echo "$name-ldap:$label"; echo "$name-ldap:$GITHUB_SHA"; echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ]; then echo "push=true" >> "$GITHUB_OUTPUT"; else echo "push=false" >> "$GITHUB_OUTPUT"; fi

      - name: Login to GitHub Container Registry
        if: steps.image.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ steps.image.outputs.push == 'true' }}
          tags: ${{ steps.image.outputs.main }}
          platforms: linux/amd64
          # Stamped into the binary; images report the release or commit
          # they were built from.
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
          # Deliberately avoid type=gha cache: Actions cache SAS tokens are
          # expiring during long/unstable network pulls in this environment.
          # Reliability > speed here.

      - name: Build and push mailbox image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/mailbox/Dockerfile
          push: ${{ steps.image.outputs.push == 'true' }}
          tags: ${{ steps.image.outputs.mailbox }}
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.image.outputs.version }}

      - name: Build and push directory image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/ldap/Dockerfile
          push: ${{ steps.image.outputs.push == 'true' }}
          tags: ${{ steps.image.outputs.ldap }}
          platforms: linux/amd64
