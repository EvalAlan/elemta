name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          # Read the module path rather than repeating it. `-X` silently does
          # nothing when the symbol does not exist, so a stale path here does not
          # fail the build — it ships binaries reporting the default 0.1.0-dev.
          # Deriving it from go.mod means renaming the module cannot desync this.
          MODULE="$(go list -m)"
          LDFLAGS="-s -w -X ${MODULE}/internal/version.Version=${VERSION}"
          go build -trimpath -ldflags "$LDFLAGS" -o dist/elemta ./cmd/elemta
          go build -trimpath -ldflags "$LDFLAGS" -o dist/elemta-cli ./cmd/elemta-cli

          # Prove the stamp actually landed. Neither binary has a `version`
          # subcommand to ask, and -s -w strips the symbol table, so inspect the
          # embedded string directly — which works on a cross-compiled binary
          # too, unlike running it.
          #
          # elemta only. cmd/elemta-cli/main.go is a stub that never imports
          # internal/version, so -X has always been a no-op there and asserting
          # on it would fail every release. Worth revisiting when that stub is
          # replaced by the cobra tree already sitting in cmd/elemta-cli/commands.
          if ! strings dist/elemta | grep -qF -- "${VERSION}"; then
            echo "::error::dist/elemta was not stamped with ${VERSION}; the -X target does not match the module path, and this build would ship the default version"
            exit 1
          fi
          echo "version stamp verified: ${VERSION}"

      - name: Package artifacts
        env:
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tar czf elemta-${VERSION}-linux-${GOARCH}.tar.gz -C dist elemta elemta-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: elemta-linux-${{ matrix.goarch }}
          path: elemta-*-linux-${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: elemta-linux-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
