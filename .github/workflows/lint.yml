name: Go Lint

on:
  pull_request:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Pinned, not @latest. GOTOOLCHAIN=local holds Go at the go.mod version, so
      # a golangci-lint release requiring a newer Go cannot build here — and
      # because it was resolved at run time, that broke every open PR at once,
      # on a commit none of them had touched. v2.13.0 needs Go 1.26; go.mod says
      # 1.25.13. Raise this together with the go.mod version, deliberately.
      - name: Install golangci-lint v2 (build with current Go toolchain)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run golangci-lint
        run: golangci-lint run --timeout=10m ./cmd/... ./internal/...

      - name: Check gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files not formatted:";
            gofmt -l .;
            exit 1;
          fi

      - name: Check go mod tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "go.mod/go.sum not tidy";
            git diff -- go.mod go.sum;
            exit 1;
          fi
