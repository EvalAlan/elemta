# Logstash end of Settings > Log shipping (docs/logging.md).
#
#   ELEMTA_SHIP_USER, ELEMTA_SHIP_PASSWORD  what the console signs in with
#   ELASTICSEARCH_URL, ES_USER, ES_PASSWORD where it goes from here
#
# Put TLS on the input, or a proxy in front of it, off a private network.
input {
  http {
    port => 8080
    codec => json
    ecs_compatibility => v8
    user => "${ELEMTA_SHIP_USER}"
    password => "${ELEMTA_SHIP_PASSWORD}"
  }
}

filter {
  # What the input says about the request isn't about the log line, and
  # event.original would repeat the whole batch in every line.
  mutate {
    remove_field => [ "http", "url", "user_agent", "[event][original]", "[host][ip]" ]
    rename => { "log_id" => "[@metadata][id]" "index_prefix" => "[@metadata][prefix]" }
  }
}

output {
  elasticsearch {
    hosts => [ "${ELASTICSEARCH_URL}" ]
    user => "${ES_USER:}"
    password => "${ES_PASSWORD:}"
    index => "%{[@metadata][prefix]}-%{+YYYY.MM.dd}"
    document_id => "%{[@metadata][id]}"
    # Maps Elemta's fields before the first line can fix their types. Change
    # index_patterns in the file too if you change the index prefix.
    template => "/usr/share/logstash/elemta/logs-template.json"
    template_name => "elemta-logs"
    template_api => "composable"
    template_overwrite => true
  }
}
