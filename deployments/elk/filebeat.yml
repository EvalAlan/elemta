# Filebeat configuration for the Elemta dev ELK stack.
#
# Elemta writes line-delimited JSON to /app/logs/elemta.log on a shared volume,
# so there is nothing to parse with regular expressions and no reason to give
# this container a Docker socket. It reads the volume read-only and ships to
# Elasticsearch.

filebeat.inputs:
  - type: filestream
    id: elemta-logs
    enabled: true
    paths:
      - /app/logs/*.log
    parsers:
      # Decode each line's JSON into real fields. Without this the whole line
      # lands in `message` as a string and nothing is searchable by field, which
      # is the entire point of shipping structured logs.
      - ndjson:
          target: ""
          # Elemta's own field wins over anything Filebeat added, so a value the
          # server reported is never quietly replaced by the shipper's guess.
          overwrite_keys: true
          # A line that is not JSON still gets shipped, tagged, rather than
          # dropped. A shipper that silently discards what it cannot parse is
          # how an incident gets investigated with half the evidence missing.
          add_error_key: true
          message_key: msg

processors:
  # Elemta emits `time`; Elasticsearch indexes on `@timestamp`. Without this
  # every event is stamped with the moment Filebeat read it, so ordering
  # survives only while nothing is delayed — and a backlog after an outage, the
  # one time ordering matters most, would arrive looking simultaneous.
  - timestamp:
      field: time
      layouts:
        - "2006-01-02T15:04:05Z"
        - "2006-01-02T15:04:05.999999999Z"
        - "2006-01-02T15:04:05.999999999Z07:00"
      test:
        - "2026-08-12T06:22:43.403056274Z"
      ignore_missing: true
      ignore_failure: true
  - drop_fields:
      fields: ["time"]
      ignore_missing: true

  # Move the level to where Kibana and every ECS dashboard expects it.
  - rename:
      fields:
        - from: "level"
          to: "log.level"
      ignore_missing: true
      fail_on_error: false

  # Elemta logs `service` as a string; ECS defines service as an object, so
  # Elasticsearch rejected every document carrying it with "tried to parse field
  # [service] as object, but found a concrete value" — and Filebeat dropped them
  # with a warning nobody reads.
  #
  # This was not a rounding error. 71% of log lines carry that field: every SMTP
  # command, every session created, greeted and terminated, every "message
  # processing completed". The stack looked healthy because the remaining 29% —
  # connections and deliveries — happen to lack it, so the graphs moved and
  # three quarters of the evidence was missing.
  #
  # service.name is where ECS puts it, so the value is preserved rather than
  # discarded.
  - rename:
      fields:
        - from: "service"
          to: "service.name"
      ignore_missing: true
      fail_on_error: false

  # Same collision, two more fields. ECS defines `server` and `error` as objects;
  # Elemta logs both as plain strings, so Elasticsearch rejects the whole event
  # with "tried to parse field [server] as object, but found a concrete value"
  # and Filebeat drops it.
  #
  # `server` is the expensive one: it appears on every "Attempting LMTP
  # delivery" line, which was 33% of the log — a third of the delivery path
  # invisible, while the dashboard looked merely quiet.
  #
  # This is the third time this class of bug has appeared (see `service` above).
  # To find the next one, replay real log lines into the data stream and read
  # the per-item bulk errors, rather than trusting the graphs to look wrong:
  #   docker exec elemta-node0 tail -4000 /app/logs/elemta.log > /tmp/s.log
  #   # then POST them as _bulk "create" ops against the elemta-* data stream
  - rename:
      fields:
        - from: "server"
          to: "server.address"
        - from: "error"
          to: "error.message"
        # One-off startup lines, but the collision is the same and a dropped
        # startup line is the one you want when a stack will not come up.
        - from: "source"
          to: "source.address"
        - from: "file"
          to: "file.path"
      ignore_missing: true
      fail_on_error: false

  # Host metadata is noise here: every event comes from one container on one
  # machine, and the fields that matter (component, hostname, message_id) are
  # already in the log line.
  - drop_fields:
      fields: ["agent", "ecs", "input", "host", "log.offset"]
      ignore_missing: true

output.elasticsearch:
  hosts: ["http://elemta-elasticsearch:9200"]
  index: "elemta-%{+yyyy.MM.dd}"

# A daily index needs a template that owns the pattern, or Elasticsearch applies
# its defaults and the field types are whatever the first document implied.
setup.template.name: "elemta"
setup.template.pattern: "elemta-*"
setup.ilm.enabled: false

# Kibana is configured by the make target rather than here: the data view is
# created through the API once, which is easier to see and to re-run than a
# setup step buried in the shipper.
setup.kibana.host: "elemta-kibana:5601"

logging.level: info
logging.to_files: false
