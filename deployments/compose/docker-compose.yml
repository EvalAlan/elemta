  #     - monitoring_network
  #   depends_on:
  #     - prometheus
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 10s

  # alertmanager:
  #   image: prom/alertmanager:latest
  #   container_name: elemta-alertmanager
  #   ports:
  #     - "9093:9093"
  #   volumes:
  #     - ./monitoring/alertmanager:/etc/alertmanager
  #     - alertmanager_data:/alertmanager
  #   command:
  #     - '--config.file=/etc/alertmanager/alertmanager.yml'
  #     - '--storage.path=/alertmanager'
  #   networks:
  #     - monitoring_network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 20s

  # Valkey - Shared state for multinode deployments
  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: elemta-valkey
    hostname: elemta-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: >
      valkey-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - elemta_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Explicit benchmark-only destination. Mail accepted by this service is
  # discarded, so it must never be the normal development delivery target.
  # make sink-up starts it; make sink-down restores real mailbox delivery.

  elemta-sink:
    profiles: [benchmark]
    # A stock Python image running one mounted script, rather than a build.
    # There is nothing to compile and nothing to keep up to date, and the whole
    # implementation is readable in one sitting — which matters for a thing
    # whose job is to be trusted not to distort a measurement.
    image: python:3.12-alpine
    container_name: elemta-sink
    command: ["python3", "-u", "/app/lmtp_sink.py", "--port", "2424"]
    volumes:
      - ../sink/lmtp_sink.py:/app/lmtp_sink.py:ro
    networks:
      - elemta_network
    healthcheck:
      # No curl or nc in the base image; Python is what is definitely present.
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import socket;socket.create_connection(('127.0.0.1',2424),2).close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  elemta-roundcube:
    image: roundcube/roundcubemail:latest
    container_name: elemta-roundcube
    ports:
      - "8026:80"
    environment:
      - ROUNDCUBEMAIL_DB_TYPE=sqlite
      - ROUNDCUBEMAIL_SKIN=elastic
      - ROUNDCUBEMAIL_DEFAULT_HOST=elemta-mailbox
      - ROUNDCUBEMAIL_DEFAULT_PORT=1143
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://elemta
      - ROUNDCUBEMAIL_SMTP_PORT=2525
      - ROUNDCUBEMAIL_SMTP_AUTH_TYPE=PLAIN
      - ROUNDCUBEMAIL_SMTP_USER=%u
      - ROUNDCUBEMAIL_SMTP_PASS=%p
      - ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE=25M
      - ROUNDCUBEMAIL_ASPELL_ENABLE=true
    volumes:
      - roundcube_data:/var/roundcube
      # STARTTLS options for submitting to Elemta; see the file for why.
      - ../../docker/roundcube/config/elemta-smtp.inc.php:/var/roundcube/config/elemta-smtp.inc.php:ro
      # Disable custom config for now due to Docker file sharing issues
      # - ./docker/roundcube/config/config.inc.php:/var/roundcube/config/config.inc.php:ro
    networks:
      - elemta_network
    restart: unless-stopped
    depends_on:
      - elemta-mailbox
      - elemta
      - elemta-ldap
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  # Monitoring Stack

networks:
  elemta_network:
    driver: bridge
    # Fixed so elemta-dns can have a fixed address. An existing stack needs one
    # `make down` to recreate the network with it.
    ipam:
      config:
        - subnet: ${ELEMTA_DEV_DNS_SUBNET:-10.253.53.0/24}
  monitoring_network:
    driver: bridge

volumes:
  mailbox_metadata:
  mailbox_bodies:
  elemta_queue:
    driver: local
  # The configuration the services actually read. Shared so a change saved in
  # the web UI reaches the SMTP node, and durable so it survives a restart.
  elemta_config:
    driver: local
  elemta_logs:
    driver: local
