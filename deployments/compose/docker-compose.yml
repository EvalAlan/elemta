# Mail is stored by Elemta's own mailbox service (IMAP, LMTP and
# ManageSieve), with Postgres metadata and file or S3 message bodies.
x-mailbox: &mailbox
  image: elemta-mailbox:dev
  build:
    context: ../..
    dockerfile: docker/mailbox/Dockerfile
  restart: unless-stopped
  mem_limit: 512m
  env_file:
    - path: .secrets/mailbox.env
      required: true
    - path: .secrets/mailbox-client.env
      required: true
  volumes:
    - ../../config/mailbox-main.toml:/etc/elemta/mailbox.toml:ro
    - ./.secrets/mailbox-tls/cert.pem:/etc/elemta/tls/cert.pem:ro
    - ./.secrets/mailbox-tls/key.pem:/etc/elemta/tls/key.pem:ro
    - mailbox_bodies:/var/lib/elemta/bodies
  tmpfs: [/tmp:size=64m]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    elemta-mailbox-db:
      condition: service_healthy
    elemta-ldap:
      condition: service_healthy
  networks: [elemta_network]
  healthcheck:
    test: [CMD, curl, -fsS, http://localhost:8080/readyz]
    interval: 5s
    timeout: 3s
    retries: 20

services:
  elemta:
    image: elemta:latest
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: elemta-node0
    # This service's own LDAP service-account credentials, generated by
    # scripts/dev-secrets.sh (make ensure-dev-secrets). Optional, so a bare
    # `docker compose up` still starts; see scripts/ldap-service-accounts.sh.
    env_file:
      - path: .secrets/elemta.env
        required: false
    restart: unless-stopped
    ports:
      - "2525:2525" # SMTP server port (inbound / MX)
      - "2587:2587" # Submission port (outbound, login or allowed_relays)
      - "9080:8080" # Metrics endpoint
    volumes:
      - elemta_queue:/app/queue
      - elemta_logs:/app/logs
      # The SMTP node reads its configuration from here. Without this mount the
      # config is only whatever was baked into the image at build time, so a
      # change saved from the web UI would be written to a file this server
      # never reads — the toggle would report success and do nothing.
      - ../../config:/app/config:ro
      - elemta_config:/app/runtime-config:rw
      # The dev mailbox certificate, pinned as the CA for LMTP over STARTTLS.
      - ./.secrets/mailbox-tls/cert.pem:/app/mailbox-ca.pem:ro
      # Disable plugins mount for now due to Docker file sharing issues
      # - ./plugins:/app/plugins:ro
    environment:
      # Opt-in profiling on the metrics port. Off unless explicitly set:
      # pprof exposes goroutine stacks and a CPU profiler, and this port binds
      # 0.0.0.0. ELEMTA_PPROF=1 make ... to turn it on for a debugging session.
      - ELEMTA_PPROF=${ELEMTA_PPROF:-0}
      - TZ=UTC
      # Set by `make install-dev` so a dev install re-applies config/elemta.toml.
      # Unset for ordinary up/restart, which must not discard what the UI saved.
      - ELEMTA_CONFIG_RESEED=${ELEMTA_CONFIG_RESEED:-}
      # This is a development stack, so it may issue itself a short-lived
      # certificate when it cannot read one. Never set this in production: a
      # server that quietly self-signs looks healthy while being untrusted.
      - ELEMTA_DEV_CERT=true
      # Seeds a worked example into the mass mailer. Development only: a
      # deployment should not invent content it was not asked for.
      - ELEMTA_DEMO_DATA=${ELEMTA_DEMO_DATA:-true}
      - ELEMTA_DEV_CERT_DAYS=${ELEMTA_DEV_CERT_DAYS:-7}
      - DEBUG=true
      - NODE_ID=0
      - TEST_MODE=true
      - ELEMTA_CONFIG_PATH=/app/config/elemta.toml
      - API_PORT=8081 # Used internally only
      - DELIVERY_HOST=elemta-mailbox
      - DELIVERY_PORT=2424
      # App passwords and users' "require app passwords" setting at SMTP AUTH
      # (internal/smtp/app_passwords.go). Only the webmail is exempt.
      - ELEMTA_AUTH_MAILBOX_SECURITY_URL=http://elemta-mailbox:8080
      # Class-of-service sending limits are counted here, so every MTA node
      # counts against the same totals (internal/smtp/sender_policy.go).
      - VALKEY_ADDR=elemta-valkey:6379
    # Security configuration for the container
    security_opt:
      - no-new-privileges:true
    user: "1001:1001" # Run as non-root user (elemta)
    read_only: false # Set to false as we need to write to /app/queue and /app/logs
    tmpfs:
      - /tmp
      - /var/tmp
    cap_drop:
      - ALL
    cap_add: []
    init: true
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2525" ]
      interval: 10s
      timeout: 5s
      retries: 3
    # Lookups go to elemta-dns, a caching resolver, not the host's. See
    # deployments/dns/unbound.conf for why.
    dns:
      - ${ELEMTA_DEV_DNS_IP:-10.253.53.53}
    networks:
      - elemta_network
    depends_on:
      elemta-dns:
        condition: service_healthy
      elemta-clamav:
        condition: service_healthy
      elemta-rspamd:
        condition: service_healthy
      elemta-mailbox:
        condition: service_healthy
      elemta-ldap:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # elemta-api:
  #   image: python:3.9-slim
  #   container_name: elemta-api
  #   restart: unless-stopped
  #   ports:
  #     - "8081:8081"
  #   volumes:
  #     - ./scripts/api_server.py:/app/api_server.py
  #     - elemta_queue:/app/queue:ro
  #   environment:
  #     - API_PORT=8081
  #   command: >
  #     bash -c "apt-get update && apt-get install -y curl && 
  #     python3 /app/api_server.py"
  #   networks:
  #     - elemta_network
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 15s

  elemta-web:
    image: elemta:latest
    container_name: elemta-web
    # This service's own LDAP service-account credentials, generated by
    # scripts/dev-secrets.sh (make ensure-dev-secrets). Optional, so a bare
    # `docker compose up` still starts; see scripts/ldap-service-accounts.sh.
    env_file:
      - path: .secrets/web.env
        required: false
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI port
    volumes:
      - elemta_queue:/app/queue:rw
      - elemta_logs:/app/logs:rw
      - ../../config:/app/config:ro
      - elemta_config:/app/runtime-config:rw
      # Web files are now included in the Docker image
    command: [ "/bin/sh", "-lc", "exec /app/elemta --config \"$(/app/prepare-config.sh)\" web --listen 0.0.0.0:8025 --web-root /app/web/static" ]
    environment:
      - TZ=UTC
      # Set by `make install-dev` so a dev install re-applies config/elemta.toml.
      # Unset for ordinary up/restart, which must not discard what the UI saved.
      - ELEMTA_CONFIG_RESEED=${ELEMTA_CONFIG_RESEED:-}
      # This is a development stack, so it may issue itself a short-lived
      # certificate when it cannot read one. Never set this in production: a
      # server that quietly self-signs looks healthy while being untrusted.
      - ELEMTA_DEV_CERT=true
      # Seeds a worked example into the mass mailer. Development only: a
      # deployment should not invent content it was not asked for.
      - ELEMTA_DEMO_DATA=${ELEMTA_DEMO_DATA:-true}
      - ELEMTA_DEV_CERT_DAYS=${ELEMTA_DEV_CERT_DAYS:-7}
      - NODE_ID=web
      - ELEMTA_WEBMAIL_PUBLIC_URL=${ELEMTA_WEBMAIL_PUBLIC_URL:-http://localhost:8027}
      - VALKEY_ADDR=elemta-valkey:6379
    # Security configuration for the container
    security_opt:
      - no-new-privileges:true
    user: "1001:1001" # Run as non-root user (elemta)
    read_only: false # Set to false as we need to write to /app/queue and /app/logs
    tmpfs:
      - /tmp
      - /var/tmp
    cap_drop:
      - ALL
    cap_add: []
    entrypoint: []
    networks:
      - elemta_network
    depends_on:
      - elemta
    healthcheck:
      # /api/health, not /. Since the dashboard requires a login, / answers 401
      # to an unauthenticated probe and `curl -f` exits non-zero, which marked a
      # perfectly healthy container unhealthy for as long as auth was on — and
      # would have had an orchestrator restarting it in a loop. /api/health is
      # public precisely so probes have something to ask.
      test: [ "CMD", "curl", "-f", "http://localhost:8025/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  elemta-webmail:
    image: elemta:latest
    container_name: elemta-webmail
    # This service's own LDAP service-account credentials, generated by
    # scripts/dev-secrets.sh (make ensure-dev-secrets). Optional, so a bare
    # `docker compose up` still starts; see scripts/ldap-service-accounts.sh.
    env_file:
      - path: .secrets/webmail.env
        required: false
    restart: unless-stopped
    ports:
      - "8027:8027" # Webmail
    volumes:
      - ../../config:/app/config:ro
      - elemta_config:/app/runtime-config:rw
    command: [ "/bin/sh", "-lc", "exec /app/elemta --config \"$(/app/prepare-config.sh)\" webmail" ]
    environment:
      - TZ=UTC
      - ELEMTA_CONFIG_RESEED=${ELEMTA_CONFIG_RESEED:-}
      - NODE_ID=webmail
      # Two-step verification and app passwords live in the mailbox
      # service; its internal API is on the proxy's health port, which is
      # never published ([webmail] security_url).
      - ELEMTA_WEBMAIL_SECURITY_URL=http://elemta-mailbox:8080
      # Sessions are kept in Valkey, so a restart or a second webmail
      # container doesn't sign anyone out ([webmail] session_store).
      - VALKEY_ADDR=elemta-valkey:6379
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    entrypoint: []
    # The webmail sends on the MTA's webmail submission port
    # (listen_webmail_submission), which is what lets users who require app
    # passwords send with their account password; no fixed address needed,
    # so it can run as several instances.
    networks:
      - elemta_network
    depends_on:
      - elemta
      - elemta-mailbox
      - valkey
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8027/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  elemta-clamav:
    image: clamav/clamav:latest
    container_name: elemta-clamav
    restart: unless-stopped
    networks:
      - elemta_network
    volumes:
      - clamav_data:/var/lib/clamav
    # ClamAV needs some capabilities for file operations
    cap_drop:
      - NET_RAW
      - NET_BIND_SERVICE
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "3310" ]
      interval: 45s
      timeout: 15s
      retries: 5
      start_period: 180s

  # Caching resolver for the stack. Built from Alpine's unbound package
  # rather than a third-party image; the config is deployments/dns/unbound.conf.
  # It needs a fixed address because a container's `dns:` takes an IP, not a
  # name. Override ELEMTA_DEV_DNS_SUBNET / ELEMTA_DEV_DNS_IP if the default
  # range collides with a network on the host.
  elemta-dns:
    image: elemta-dns:dev
    build:
      context: ../dns
      dockerfile_inline: |
        FROM alpine:3.22
        RUN apk add --no-cache unbound dnssec-root \
         && cp /usr/share/dnssec-root/trusted-key.key /etc/unbound/root.key
        CMD ["unbound", "-d", "-c", "/etc/unbound/unbound.conf"]
    container_name: elemta-dns
    restart: unless-stopped
    volumes:
      - ../dns/unbound.conf:/etc/unbound/unbound.conf:ro
    networks:
      elemta_network:
        ipv4_address: ${ELEMTA_DEV_DNS_IP:-10.253.53.53}
    healthcheck:
      test: [ "CMD-SHELL", "nslookup -type=NS . 127.0.0.1 >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  elemta-rspamd:
    image: rspamd/rspamd:latest
    container_name: elemta-rspamd
    restart: unless-stopped
    # Lookups go to elemta-dns, a caching resolver, not the host's. See
    # deployments/dns/unbound.conf for why.
    dns:
      - ${ELEMTA_DEV_DNS_IP:-10.253.53.53}
    depends_on:
      elemta-dns:
        condition: service_healthy
      rspamd-valkey:
        condition: service_healthy
    networks:
      - elemta_network
    volumes:
      - rspamd_data:/var/lib/rspamd
      # Disable custom configuration for now to avoid Docker mount issues
      # - ./docker/rspamd/override.d/worker-controller.conf:/etc/rspamd/override.d/worker-controller.conf
      # - ./docker/rspamd/override.d/worker-proxy.conf:/etc/rspamd/override.d/worker-proxy.conf
      # - ./docker/rspamd/override.d/worker-normal.conf:/etc/rspamd/override.d/worker-normal.conf
      - ../../docker/rspamd/override.d/rbl.conf:/etc/rspamd/override.d/rbl.conf:ro
      - ../../docker/rspamd/override.d/surbl.conf:/etc/rspamd/override.d/surbl.conf:ro
      - ../../docker/rspamd/override.d/asn.conf:/etc/rspamd/override.d/asn.conf:ro
      - ../../docker/rspamd/override.d/fuzzy_check.conf:/etc/rspamd/override.d/fuzzy_check.conf:ro
      - ../../docker/rspamd/override.d/options.inc:/etc/rspamd/override.d/options.inc:ro
      # local.d merges with the packaged config; override.d replaces whole
      # sections. Bayes and its Redis backend belong in local.d.
      - ../../docker/rspamd/local.d/classifier-bayes.conf:/etc/rspamd/local.d/classifier-bayes.conf:ro
      - ../../docker/rspamd/local.d/redis.conf:/etc/rspamd/local.d/redis.conf:ro
      # Greylisting comes along for free with Redis and nobody asked for it.
      - ../../docker/rspamd/local.d/greylist.conf:/etc/rspamd/local.d/greylist.conf:ro
      # The reject threshold is what decides how much spam Elemta refuses.
      - ../../docker/rspamd/local.d/actions.conf:/etc/rspamd/local.d/actions.conf:ro
      - ../../docker/rspamd/local.d/url_suspect_group.conf:/etc/rspamd/local.d/url_suspect_group.conf:ro
      # - ./docker/rspamd/override.d/modules.conf:/etc/rspamd/override.d/modules.conf
      # - ./docker/rspamd/override.d/logging.conf:/etc/rspamd/override.d/logging.conf
      # - ./docker/rspamd/override.d/actions.conf:/etc/rspamd/override.d/actions.conf
    ports:
      - "11334:11334" # Web interface
    # Rspamd needs some capabilities for network operations
    cap_drop:
      - NET_RAW
      - NET_BIND_SERVICE
    healthcheck:
      # Use pidof to check if rspamd is running
      test: [ "CMD-SHELL", "pidof rspamd || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  elemta-ldap:
    # OpenLDAP 2.6 on Alpine, configured on first start (docker/ldap).
    image: elemta-ldap:dev
    build:
      context: ../..
      dockerfile: docker/ldap/Dockerfile
    container_name: elemta-ldap
    hostname: elemta-ldap
    # How scripts find the directory's nodes (scripts/lib/ldap.sh); the
    # scaling overlay runs several.
    labels:
      elemta.ldap.node: "1"
    # Everything authenticates against the directory, so it must come back
    # after a reboot like the services that depend on it.
    restart: unless-stopped
    ports:
      - "1389:389" # LDAP port
    env_file:
      - path: .secrets/ldap-admin.env
        required: true
    environment:
      - LDAP_ORGANISATION=Example Corp
      - LDAP_BASE_DN=dc=example,dc=com
    volumes:
      # New volumes: the previous image's database (OpenLDAP 2.4) can't be
      # opened by this one, and leaving the old volumes untouched keeps a
      # rollback possible. scripts/ldap-migrate.sh moves the entries over.
      - ldap_db:/var/lib/ldap
      - ldap_slapd:/etc/ldap/slapd.d
      # The previous image's database, read only and only so the new image
      # can refuse to start empty while a directory that hasn't been moved
      # is still there.
      - ldap_data:/legacy:ro
      - ../../docker/ldap:/docker-entrypoint-initdb.d:ro
    networks:
      - elemta_network
    healthcheck:
      test: [ "CMD", "ldapsearch", "-Q", "-Y", "EXTERNAL", "-H", "ldapi:///", "-b", "dc=example,dc=com", "-s", "base", "-LLL", "dn" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 45s

  elemta-mailbox-db:
    image: postgres:17-alpine
    container_name: elemta-mailbox-db
    restart: unless-stopped
    mem_limit: 1g
    env_file:
      - path: .secrets/mailbox-postgres.env
        required: true
    volumes: [mailbox_metadata:/var/lib/postgresql/data]
    # pg_stat_statements records which queries cost the time, the first
    # thing to look at when the database is the bottleneck (it was, under
    # the load tests). Its overhead is negligible.
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, pg_stat_statements.track=top, -c, track_io_timing=on]
    networks: [elemta_network]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U mailbox -d mailbox]
      interval: 3s
      timeout: 3s
      retries: 20

  # The mailbox servers: as many as `deploy.replicas` (or `--scale
  # elemta-mailbox-server=N`), all equal, behind elemta-mailbox. No
  # container_name, which would stop Compose from running more than one.
  elemta-mailbox-server:
    <<: *mailbox
    deploy:
      replicas: ${ELEMTA_MAILBOX_REPLICAS:-2}
    environment:
      # The public listeners take the PROXY protocol from the load balancer
      # in front, so mail apps keep their own addresses (sign-in throttling).
      - ELEMTA_MAILBOX_PROXY_PROTOCOL_FROM=${ELEMTA_MAILBOX_LB_IP:-10.253.53.24}

  elemta-mailbox:
    image: haproxy:3.0-alpine
    container_name: elemta-mailbox
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "14143:1143"
      - "127.0.0.1:143:11143"
      - "127.0.0.1:110:1110"
      - "993:10993"
      - "2424:2424"
      - "4190:4190"
    volumes:
      - ./mailbox/main-haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      elemta_network:
        # Fixed: the mailbox servers take the PROXY protocol from this
        # address only.
        ipv4_address: ${ELEMTA_MAILBOX_LB_IP:-10.253.53.24}
    depends_on:
      elemta-mailbox-server:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 3s
      retries: 20

  # Monitoring services

  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: elemta-prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./monitoring/prometheus:/etc/prometheus
  #     - prometheus_data:/prometheus
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #     - '--storage.tsdb.path=/prometheus'
  #   networks:
  #     - monitoring_network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 20s

  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: elemta-grafana
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #     - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
  #     - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
  #   environment:
  #     - GF_SECURITY_ADMIN_USER=admin
  #     - GF_SECURITY_ADMIN_PASSWORD=elemta123
  #     - GF_USERS_ALLOW_SIGN_UP=false
  #   networks:
  #     - monitoring_network
  #   depends_on:
  #     - prometheus
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 10s

  # alertmanager:
  #   image: prom/alertmanager:latest
  #   container_name: elemta-alertmanager
  #   ports:
  #     - "9093:9093"
  #   volumes:
  #     - ./monitoring/alertmanager:/etc/alertmanager
  #     - alertmanager_data:/alertmanager
  #   command:
  #     - '--config.file=/etc/alertmanager/alertmanager.yml'
  #     - '--storage.path=/alertmanager'
  #   networks:
  #     - monitoring_network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 20s

  # Valkey - Shared state for multinode deployments
  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: elemta-valkey
    hostname: elemta-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: >
      valkey-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy noeviction
    networks:
      - elemta_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Scanner state has a separate capacity/eviction policy from session,
  # recovery, throttling, and revocation state.
  rspamd-valkey:
    image: valkey/valkey:8.0-alpine
    container_name: elemta-rspamd-valkey
    command: >
      valkey-server --appendonly yes --appendfsync everysec --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - rspamd_valkey_data:/data
    networks:
      - elemta_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Explicit benchmark-only destination. Mail accepted by this service is
  # discarded, so it must never be the normal development delivery target.
  # make sink-up starts it; make sink-down restores real mailbox delivery.

  elemta-sink:
    profiles: [benchmark]
    # A stock Python image running one mounted script, rather than a build.
    # There is nothing to compile and nothing to keep up to date, and the whole
    # implementation is readable in one sitting — which matters for a thing
    # whose job is to be trusted not to distort a measurement.
    image: python:3.12-alpine
    container_name: elemta-sink
    command: ["python3", "-u", "/app/lmtp_sink.py", "--port", "2424"]
    volumes:
      - ../sink/lmtp_sink.py:/app/lmtp_sink.py:ro
    networks:
      - elemta_network
    healthcheck:
      # No curl or nc in the base image; Python is what is definitely present.
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import socket;socket.create_connection(('127.0.0.1',2424),2).close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Monitoring Stack

networks:
  elemta_network:
    driver: bridge
    # Fixed so elemta-dns can have a fixed address. An existing stack needs one
    # `make down` to recreate the network with it.
    ipam:
      config:
        - subnet: ${ELEMTA_DEV_DNS_SUBNET:-10.253.53.0/24}
  monitoring_network:
    driver: bridge

volumes:
  mailbox_metadata:
  mailbox_bodies:
  elemta_queue:
    driver: local
  # The configuration the services actually read. Shared so a change saved in
  # the web UI reaches the SMTP node, and durable so it survives a restart.
  elemta_config:
    driver: local
  elemta_logs:
    driver: local
  elemta_plugins:
    driver: local
  clamav_data:
    driver: local
  rspamd_data:
    driver: local
  valkey_data:
    driver: local
  rspamd_valkey_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  ldap_db:
    driver: local
  ldap_slapd:
    driver: local
  # The previous directory image's database; see elemta-ldap.
  ldap_data:
    driver: local
