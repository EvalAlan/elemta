# The normal dev stack uses Elemta mailbox storage. Dovecot is available
# only via the dovecot-rollback profile; its data volume is retained.
x-mailbox: &mailbox
  image: elemta-mailbox:dev
  build:
    context: ../..
    dockerfile: docker/mailbox/Dockerfile
  restart: unless-stopped
  mem_limit: 512m
  env_file:
    - path: .secrets/mailbox.env
      required: true
    - path: .secrets/mailbox-client.env
      required: true
  volumes:
    - ../../config/mailbox-main.toml:/etc/elemta/mailbox.toml:ro
    - mailbox_bodies:/var/lib/elemta/bodies
  tmpfs: [/tmp:size=64m]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    elemta-mailbox-db:
      condition: service_healthy
    elemta-ldap:
      condition: service_healthy
  networks: [elemta_network]
  healthcheck:
    test: [CMD, curl, -fsS, http://localhost:8080/readyz]
    interval: 5s
    timeout: 3s
    retries: 20

services:
  elemta:
    image: elemta:latest
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: elemta-node0
    # This service's own LDAP service-account credentials, generated by
    # scripts/dev-secrets.sh (make ensure-dev-secrets). Optional, so a bare
    # `docker compose up` still starts; see scripts/ldap-service-accounts.sh.
    env_file:
      - path: .secrets/elemta.env
        required: false
    restart: unless-stopped
    ports:
      - "2525:2525" # SMTP server port (inbound / MX)
      - "2587:2587" # Submission port (outbound, login or allowed_relays)
      - "9080:8080" # Metrics endpoint
    volumes:
      - elemta_queue:/app/queue
      - elemta_logs:/app/logs
      # The SMTP node reads its configuration from here. Without this mount the
      # config is only whatever was baked into the image at build time, so a
      # change saved from the web UI would be written to a file this server
      # never reads — the toggle would report success and do nothing.
      - ../../config:/app/config:ro
      - elemta_config:/app/runtime-config:rw
      # Disable plugins mount for now due to Docker file sharing issues
      # - ./plugins:/app/plugins:ro
    environment:
      # Opt-in profiling on the metrics port. Off unless explicitly set:
      # pprof exposes goroutine stacks and a CPU profiler, and this port binds
      # 0.0.0.0. ELEMTA_PPROF=1 make ... to turn it on for a debugging session.
      - ELEMTA_PPROF=${ELEMTA_PPROF:-0}
      - TZ=UTC
      # Set by `make install-dev` so a dev install re-applies config/elemta.toml.
      # Unset for ordinary up/restart, which must not discard what the UI saved.
      - ELEMTA_CONFIG_RESEED=${ELEMTA_CONFIG_RESEED:-}
      # This is a development stack, so it may issue itself a short-lived
      # certificate when it cannot read one. Never set this in production: a
      # server that quietly self-signs looks healthy while being untrusted.
      - ELEMTA_DEV_CERT=true
      # Seeds a worked example into the mass mailer. Development only: a
      # deployment should not invent content it was not asked for.
      - ELEMTA_DEMO_DATA=${ELEMTA_DEMO_DATA:-true}
      - ELEMTA_DEV_CERT_DAYS=${ELEMTA_DEV_CERT_DAYS:-7}
      - DEBUG=true
      - NODE_ID=0
      - TEST_MODE=true
      - ELEMTA_CONFIG_PATH=/app/config/elemta.toml
      - API_PORT=8081 # Used internally only
      - DELIVERY_HOST=elemta-mailbox
      - DELIVERY_PORT=2424
    # Security configuration for the container
    security_opt:
      - no-new-privileges:true
    user: "1001:1001" # Run as non-root user (elemta)
    read_only: false # Set to false as we need to write to /app/queue and /app/logs
    tmpfs:
      - /tmp
      - /var/tmp
    cap_drop:
      - ALL
    cap_add: []
    init: true
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2525" ]
      interval: 10s
      timeout: 5s
      retries: 3
    # Lookups go to elemta-dns, a caching resolver, not the host's. See
    # deployments/dns/unbound.conf for why.
    dns:
      - ${ELEMTA_DEV_DNS_IP:-10.253.53.53}
    networks:
      - elemta_network
    depends_on:
      elemta-dns:
        condition: service_healthy
      elemta-clamav:
        condition: service_healthy
      elemta-rspamd:
        condition: service_healthy
      elemta-mailbox:
        condition: service_healthy
      elemta-ldap:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # elemta-api:
  #   image: python:3.9-slim
  #   container_name: elemta-api
  #   restart: unless-stopped
  #   ports:
  #     - "8081:8081"
  #   volumes:
  #     - ./scripts/api_server.py:/app/api_server.py
  #     - elemta_queue:/app/queue:ro
  #   environment:
  #     - API_PORT=8081
  #   command: >
  #     bash -c "apt-get update && apt-get install -y curl && 
  #     python3 /app/api_server.py"
  #   networks:
  #     - elemta_network
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 15s

  elemta-web:
    image: elemta:latest
    container_name: elemta-web
    # This service's own LDAP service-account credentials, generated by
    # scripts/dev-secrets.sh (make ensure-dev-secrets). Optional, so a bare
    # `docker compose up` still starts; see scripts/ldap-service-accounts.sh.
    env_file:
      - path: .secrets/web.env
        required: false
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI port
    volumes:
      - elemta_queue:/app/queue:rw
      - elemta_logs:/app/logs:rw
      - ../../config:/app/config:ro
      - elemta_config:/app/runtime-config:rw
      # Web files are now included in the Docker image
    command: [ "/bin/sh", "-lc", "exec /app/elemta --config \"$(/app/prepare-config.sh)\" web --listen 0.0.0.0:8025 --web-root /app/web/static" ]
    environment:
      - TZ=UTC
      # Set by `make install-dev` so a dev install re-applies config/elemta.toml.
      # Unset for ordinary up/restart, which must not discard what the UI saved.
      - ELEMTA_CONFIG_RESEED=${ELEMTA_CONFIG_RESEED:-}
      # This is a development stack, so it may issue itself a short-lived
      # certificate when it cannot read one. Never set this in production: a
      # server that quietly self-signs looks healthy while being untrusted.
      - ELEMTA_DEV_CERT=true
      # Seeds a worked example into the mass mailer. Development only: a
      # deployment should not invent content it was not asked for.
      - ELEMTA_DEMO_DATA=${ELEMTA_DEMO_DATA:-true}
      - ELEMTA_DEV_CERT_DAYS=${ELEMTA_DEV_CERT_DAYS:-7}
      - NODE_ID=web
      - VALKEY_ADDR=elemta-valkey:6379
    # Security configuration for the container
    security_opt:
      - no-new-privileges:true
    user: "1001:1001" # Run as non-root user (elemta)
    read_only: false # Set to false as we need to write to /app/queue and /app/logs
    tmpfs:
      - /tmp
      - /var/tmp
    cap_drop:
      - ALL
    cap_add: []
    entrypoint: []
    networks:
      - elemta_network
    depends_on:
      - elemta
    healthcheck:
      # /api/health, not /. Since the dashboard requires a login, / answers 401
      # to an unauthenticated probe and `curl -f` exits non-zero, which marked a
      # perfectly healthy container unhealthy for as long as auth was on — and
      # would have had an orchestrator restarting it in a loop. /api/health is
      # public precisely so probes have something to ask.
      test: [ "CMD", "curl", "-f", "http://localhost:8025/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  elemta-webmail:
    image: elemta:latest
    container_name: elemta-webmail
    # This service's own LDAP service-account credentials, generated by
    # scripts/dev-secrets.sh (make ensure-dev-secrets). Optional, so a bare
    # `docker compose up` still starts; see scripts/ldap-service-accounts.sh.
    env_file:
      - path: .secrets/webmail.env
        required: false
    restart: unless-stopped
    ports:
      - "8027:8027" # Webmail
    volumes:
      - ../../config:/app/config:ro
      - elemta_config:/app/runtime-config:rw
    command: [ "/bin/sh", "-lc", "exec /app/elemta --config \"$(/app/prepare-config.sh)\" webmail" ]
    environment:
      - TZ=UTC
      - ELEMTA_CONFIG_RESEED=${ELEMTA_CONFIG_RESEED:-}
      - NODE_ID=webmail
      # Sessions are kept in Valkey, so a restart or a second webmail
      # container doesn't sign anyone out ([webmail] session_store).
      - VALKEY_ADDR=elemta-valkey:6379
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    entrypoint: []
    networks:
      - elemta_network
    depends_on:
      - elemta
      - elemta-mailbox
      - valkey
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8027/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  elemta-clamav:
    image: clamav/clamav:latest
    container_name: elemta-clamav
    restart: unless-stopped
    networks:
      - elemta_network
    volumes:
      - clamav_data:/var/lib/clamav
    # ClamAV needs some capabilities for file operations
    cap_drop:
      - NET_RAW
      - NET_BIND_SERVICE
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "3310" ]
      interval: 45s
      timeout: 15s
      retries: 5
      start_period: 180s

  # Caching resolver for the stack. Built from Alpine's unbound package
  # rather than a third-party image; the config is deployments/dns/unbound.conf.
  # It needs a fixed address because a container's `dns:` takes an IP, not a
  # name. Override ELEMTA_DEV_DNS_SUBNET / ELEMTA_DEV_DNS_IP if the default
  # range collides with a network on the host.
  elemta-dns:
    image: elemta-dns:dev
    build:
      context: ../dns
      dockerfile_inline: |
        FROM alpine:3.22
        RUN apk add --no-cache unbound dnssec-root \
         && cp /usr/share/dnssec-root/trusted-key.key /etc/unbound/root.key
        CMD ["unbound", "-d", "-c", "/etc/unbound/unbound.conf"]
    container_name: elemta-dns
    restart: unless-stopped
    volumes:
      - ../dns/unbound.conf:/etc/unbound/unbound.conf:ro
    networks:
      elemta_network:
        ipv4_address: ${ELEMTA_DEV_DNS_IP:-10.253.53.53}
    healthcheck:
      test: [ "CMD-SHELL", "nslookup -type=NS . 127.0.0.1 >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  elemta-rspamd:
    image: rspamd/rspamd:latest
    container_name: elemta-rspamd
    restart: unless-stopped
    # Lookups go to elemta-dns, a caching resolver, not the host's. See
    # deployments/dns/unbound.conf for why.
    dns:
      - ${ELEMTA_DEV_DNS_IP:-10.253.53.53}
    depends_on:
      elemta-dns:
        condition: service_healthy
    networks:
      - elemta_network
    volumes:
      - rspamd_data:/var/lib/rspamd
      # Disable custom configuration for now to avoid Docker mount issues
      # - ./docker/rspamd/override.d/worker-controller.conf:/etc/rspamd/override.d/worker-controller.conf
      # - ./docker/rspamd/override.d/worker-proxy.conf:/etc/rspamd/override.d/worker-proxy.conf
      # - ./docker/rspamd/override.d/worker-normal.conf:/etc/rspamd/override.d/worker-normal.conf
      - ../../docker/rspamd/override.d/rbl.conf:/etc/rspamd/override.d/rbl.conf:ro
      - ../../docker/rspamd/override.d/surbl.conf:/etc/rspamd/override.d/surbl.conf:ro
      - ../../docker/rspamd/override.d/asn.conf:/etc/rspamd/override.d/asn.conf:ro
      - ../../docker/rspamd/override.d/fuzzy_check.conf:/etc/rspamd/override.d/fuzzy_check.conf:ro
      - ../../docker/rspamd/override.d/options.inc:/etc/rspamd/override.d/options.inc:ro
      # local.d merges with the packaged config; override.d replaces whole
      # sections. Bayes and its Redis backend belong in local.d.
      - ../../docker/rspamd/local.d/classifier-bayes.conf:/etc/rspamd/local.d/classifier-bayes.conf:ro
      - ../../docker/rspamd/local.d/redis.conf:/etc/rspamd/local.d/redis.conf:ro
      # Greylisting comes along for free with Redis and nobody asked for it.
      - ../../docker/rspamd/local.d/greylist.conf:/etc/rspamd/local.d/greylist.conf:ro
      # The reject threshold is what decides how much spam Elemta refuses.
      - ../../docker/rspamd/local.d/actions.conf:/etc/rspamd/local.d/actions.conf:ro
      # - ./docker/rspamd/override.d/modules.conf:/etc/rspamd/override.d/modules.conf
      # - ./docker/rspamd/override.d/logging.conf:/etc/rspamd/override.d/logging.conf
      # - ./docker/rspamd/override.d/actions.conf:/etc/rspamd/override.d/actions.conf
    ports:
      - "11334:11334" # Web interface
    # Rspamd needs some capabilities for network operations
    cap_drop:
      - NET_RAW
      - NET_BIND_SERVICE
    healthcheck:
      # Use pidof to check if rspamd is running
      test: [ "CMD-SHELL", "pidof rspamd || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  elemta-ldap:
    image: osixia/openldap:latest
    container_name: elemta-ldap
    hostname: elemta-ldap
    ports:
      - "1389:389" # LDAP port
      - "1636:636" # LDAPS port  
    environment:
      - LDAP_ORGANISATION=Example Corp
      - LDAP_DOMAIN=example.com
      - LDAP_ADMIN_PASSWORD=admin
      - LDAP_BASE_DN=dc=example,dc=com
      - LDAP_TLS_VERIFY_CLIENT=never
      - LDAP_RFC2307BIS_SCHEMA=true
      - LDAP_REMOVE_CONFIG_AFTER_SETUP=true
      - LDAP_TLS=false
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ../../docker/ldap:/docker-entrypoint-initdb.d:ro
    networks:
      - elemta_network
    healthcheck:
      test: [ "CMD", "sh", "-c", "ldapsearch -x -H ldapi:/// -Y EXTERNAL -b 'ou=people,dc=example,dc=com' '(uid=user)' 2>&1 | grep -q 'uid: user' || ldapsearch -x -D 'cn=admin,dc=example,dc=com' -w admin -b 'dc=example,dc=com' -s base -LLL" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 45s

  elemta-mailbox-db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 1g
    env_file:
      - path: .secrets/mailbox-postgres.env
        required: true
    volumes: [mailbox_metadata:/var/lib/postgresql/data]
    networks: [elemta_network]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U mailbox -d mailbox]
      interval: 3s
      timeout: 3s
      retries: 20

  elemta-mailbox-a:
    <<: *mailbox
  elemta-mailbox-b:
    <<: *mailbox

  elemta-mailbox:
    image: haproxy:3.0-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "14143:1143"
      - "2424:2424"
    volumes:
      - ./mailbox/main-haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [elemta_network]
    depends_on:
      elemta-mailbox-a:
        condition: service_healthy
      elemta-mailbox-b:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 3s
      retries: 20

  elemta-dovecot:
    profiles: [dovecot-rollback]
    image: elemta_dovecot:latest
    build:
      context: ../../docker/dovecot
      dockerfile: Dockerfile
    container_name: elemta-dovecot
    # IMAP hibernation keeps thousands of idle connections in one process,
    # which needs a file descriptor each.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # This service's own LDAP service-account credentials, generated by
    # scripts/dev-secrets.sh (make ensure-dev-secrets). Optional, so a bare
    # `docker compose up` still starts; see scripts/ldap-service-accounts.sh.
    env_file:
      - path: .secrets/dovecot.env
        required: false
    hostname: elemta-dovecot
    ports:
      - "14143:14143" # IMAP port
      - "2424:2424" # LMTP port
      - "4190:4190" # ManageSieve port
    volumes:
      - dovecot_data:/var/mail
    networks:
      - elemta_network
    restart: unless-stopped
    depends_on:
      - elemta-ldap
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "14143" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  # Monitoring services

  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: elemta-prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
