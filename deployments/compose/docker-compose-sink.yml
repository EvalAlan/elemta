# An LMTP sink, as an overlay on the dev stack.
#
# Delivering to Dovecot measures Dovecot. Maildir writes, index updates and
# sieve cost around 100ms a message and saturate near 70/s on a developer
# machine, so any throughput number taken against it is a number about the
# mailbox server. This replaces the destination with something that accepts and
# discards, measured at ~4,500/s for 10KB messages — roughly fifty times what
# Dovecot manages, which is the point: a benchmark sink has to be fast enough
# to be irrelevant.
#
# Nothing else about the stack changes. Dovecot and Roundcube keep running and
# stay a working demonstration of real delivery; only where the queue sends mail
# moves. Switch with 'make sink-up', switch back with 'make sink-down'.
services:
  elemta-sink:
    # A stock Python image running one mounted script, rather than a build.
    # There is nothing to compile and nothing to keep up to date, and the whole
    # implementation is readable in one sitting — which matters for a thing
    # whose job is to be trusted not to distort a measurement.
    image: python:3.12-alpine
    container_name: elemta-sink
    command: ["python3", "-u", "/app/lmtp_sink.py", "--port", "2424"]
    volumes:
      - ../sink/lmtp_sink.py:/app/lmtp_sink.py:ro
    networks:
      - elemta_network
    healthcheck:
      # No curl or nc in the base image; Python is what is definitely present.
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import socket;socket.create_connection(('127.0.0.1',2424),2).close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
