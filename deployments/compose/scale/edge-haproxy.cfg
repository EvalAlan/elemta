# The MTA's public ports, in front of however many MTA containers run
# (docker-compose.scale.yml). Each connection carries the PROXY protocol, so
# the MTAs see every client's own address for spam checks, rate limits and
# relay rules ([server] proxy_protocol_from / ELEMTA_PROXY_PROTOCOL_FROM).
global
    log stdout format raw local0
    maxconn 8192
defaults
    mode tcp
    log global
    timeout connect 2s
    timeout check 2s
    retries 2
    option redispatch
    # SMTP sessions can idle through long DATA phases.
    timeout client 10m
    timeout server 10m
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s
frontend smtp
    bind :2525
    default_backend smtp_nodes
backend smtp_nodes
    balance leastconn
    option smtpchk EHLO edge-health
    server-template mta 20 elemta:2525 check inter 3s fall 2 rise 2 resolvers docker init-addr none send-proxy-v2
frontend submission
    bind :2587
    default_backend submission_nodes
backend submission_nodes
    balance leastconn
    option smtpchk EHLO edge-health
    server-template mta 20 elemta:2587 check inter 3s fall 2 rise 2 resolvers docker init-addr none send-proxy-v2
frontend health
    mode http
    bind :8404
    http-request return status 200 content-type text/plain string "ok\n" if { nbsrv(smtp_nodes) gt 0 }
    http-request return status 503 content-type text/plain string "no MTA\n"
