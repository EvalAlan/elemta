# The directory's address (elemta-ldap:389) in front of its replicating
# nodes (docker-compose.scale.yml). Every node takes writes; traffic goes to
# the first healthy one and moves when it fails, so a write and the read
# right after it see the same node. The nodes replicate within moments.
global
    log stdout format raw local0
    maxconn 4096
defaults
    mode tcp
    log global
    timeout connect 2s
    timeout check 2s
    retries 2
    option redispatch
    timeout client 30m
    timeout server 30m
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s
frontend ldap
    bind :389
    default_backend ldap_nodes
backend ldap_nodes
    balance first
    option ldap-check
    server ldap1 elemta-ldap-1:389 check inter 3s fall 2 rise 2 resolvers docker init-addr none
    server ldap2 elemta-ldap-2:389 check inter 3s fall 2 rise 2 resolvers docker init-addr none
    server ldap3 elemta-ldap-3:389 check inter 3s fall 2 rise 2 resolvers docker init-addr none disabled
