# HAProxy configuration for multi-master LDAP load balancing
# Provides a single endpoint for LDAP clients with health checks

global
    daemon
    log stdout format raw local0
    maxconn 4096
    tune.ssl.default-dh-param 2048

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    retries 3

# LDAP frontend - load balances across all LDAP masters
frontend ldap_front
    bind *:389
    default_backend ldap_masters

# LDAPS frontend (if TLS certs are available)
# frontend ldaps_front
#     bind *:636 ssl crt /etc/haproxy/certs/ldap.pem
#     default_backend ldap_masters

backend ldap_masters
    option tcp-check
    # Health check: TCP connect + LDAP bind anonymously to root DSE
    tcp-check connect
    tcp-check send-binary 300c020101600702010304008000 # LDAP bindRequest (anonymous)
    tcp-check expect binary 0a0100                    # bindResponse success
    balance roundrobin
    server ldap-1 elemta-ldap-1:389 check inter 10s fall 2 rise 3
    server ldap-2 elemta-ldap-2:389 check inter 10s fall 2 rise 3

# Stats endpoint (optional, for monitoring)
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 30s
    stats auth admin:${HAPROXY_STATS_PASSWORD:-admin}