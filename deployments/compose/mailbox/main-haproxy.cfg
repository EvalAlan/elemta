global
    log stdout format raw local0
    # Above the replicas' combined connection limit, so the proxy never
    # becomes the bottleneck or starves its own health checks.
    maxconn 4096
defaults
    mode tcp
    log global
    timeout connect 1s
    timeout check 1s
    retries 2
    option redispatch
    timeout client 35m
    timeout server 35m
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s
# The mailbox servers are one Compose service, scaled to any number of
# containers; server-template fills up to ten slots from its DNS name and
# follows scaling within a few seconds. The public frontends (IMAPS, IMAP
# with STARTTLS, POP3, ManageSieve) send the PROXY protocol so the servers
# see each mail app's own address; the internal ones the webmail and the
# MTA use (IMAP, LMTP) don't.
frontend imap
    bind :1143
    default_backend imap_nodes
backend imap_nodes
    balance leastconn
    option httpchk
    http-check send meth GET uri /readyz
    http-check expect status 200
    server-template mbx 10 elemta-mailbox-server:1143 check port 8080 inter 2s fall 2 rise 2 resolvers docker init-addr none
frontend imaps
    bind :10993
    default_backend imaps_nodes
backend imaps_nodes
    balance leastconn
    option httpchk
    http-check send meth GET uri /readyz
    http-check expect status 200
    server-template mbx 10 elemta-mailbox-server:10993 check port 8080 inter 2s fall 2 rise 2 resolvers docker init-addr none send-proxy-v2
