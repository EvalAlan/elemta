global
    log stdout format raw local0
    maxconn 256
defaults
    mode tcp
    log global
    timeout connect 1s
    timeout check 1s
    retries 2
    option redispatch
    timeout client 35m
    timeout server 35m
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s
frontend imap
    bind :1143
    default_backend imap_nodes
backend imap_nodes
    balance leastconn
    option httpchk
    http-check send meth GET uri /readyz
    http-check expect status 200
    server a elemta-mailbox-a:1143 check port 8080 inter 2s fall 2 rise 2 resolvers docker init-addr none
    server b elemta-mailbox-b:1143 check port 8080 inter 2s fall 2 rise 2 resolvers docker init-addr none
frontend imaps
    bind :10993
    default_backend imaps_nodes
backend imaps_nodes
    balance leastconn
    option httpchk
    http-check send meth GET uri /readyz
    http-check expect status 200
    server a elemta-mailbox-a:10993 check port 8080 inter 2s fall 2 rise 2 resolvers docker init-addr none
    server b elemta-mailbox-b:10993 check port 8080 inter 2s fall 2 rise 2 resolvers docker init-addr none
frontend lmtp
    bind :2424
    default_backend lmtp_nodes
backend lmtp_nodes
    balance leastconn
    option httpchk
    http-check send meth GET uri /readyz
    http-check expect status 200
    server a elemta-mailbox-a:2424 check port 8080 inter 2s fall 2 rise 2 resolvers docker init-addr none
    server b elemta-mailbox-b:2424 check port 8080 inter 2s fall 2 rise 2 resolvers docker init-addr none
frontend managesieve
    bind :4190
    default_backend managesieve_nodes
backend managesieve_nodes
    balance leastconn
    option httpchk
    http-check send meth GET uri /readyz
    http-check expect status 200
    server a elemta-mailbox-a:4190 check port 8080 inter 2s fall 2 rise 2 resolvers docker init-addr none
    server b elemta-mailbox-b:4190 check port 8080 inter 2s fall 2 rise 2 resolvers docker init-addr none
frontend health
    mode http
    bind :8080
    default_backend http_nodes
backend http_nodes
    mode http
    balance leastconn
    option httpchk GET /readyz
    server a elemta-mailbox-a:8080 check resolvers docker init-addr none
    server b elemta-mailbox-b:8080 check resolvers docker init-addr none
