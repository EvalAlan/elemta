# As docker/rspamd/local.d/classifier-bayes.conf, plus an expiry on the
# tokens: they live in the main Valkey here (redis.conf), which must not
# fill up. Tokens unused for 60 days go; a busy classifier keeps refreshing
# the ones that matter.
backend = "redis";
autolearn = false;
min_learns = 200;
expire = 60d;
