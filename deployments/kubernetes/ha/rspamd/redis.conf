# Rspamd's Redis backend in the replicated deployment: the main Valkey,
# found through its Sentinels, so Bayes tokens and module state survive a
# Valkey failover and every Rspamd replica shares them.
#
# The main Valkey is the security store (sessions, locks, revocations) and
# runs noeviction, so nothing here may grow without bound or it would stop
# those writes: Bayes tokens expire (classifier-bayes.conf), greylisting is
# off, and the rest of Rspamd's keys carry their own TTLs. Its own database
# keeps its keys apart and lets `valkey-cli -n 5 dbsize` show its share.
servers = "elemta-valkey-0.elemta-valkey-nodes:6379";
sentinels = "elemta-valkey-sentinel:26379";
sentinel_masters_pattern = "^elemta$";
sentinel_watch_time = 30s;
db = "5";
