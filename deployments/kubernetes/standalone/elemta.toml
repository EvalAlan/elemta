# Elemta configuration for the Kubernetes deployment.
#
# Deliberately smaller than config/elemta.toml. That file describes the full
# compose stack, and most of it names containers that do not exist here
# (elemta-ldap, elemta-clamav, elemta-rspamd, elemta-mailbox). Pointing at a
# missing scanner is not harmless: every message waits out the scan timeout and
# then goes through unscanned, which looks like a slow server rather than a
# misconfigured one. So everything with an external dependency is off, and
# turning it on is a matter of deploying the dependency and flipping it here.
#
# Every field needs an explicit toml tag in internal/config; a key the loader
# does not know is silently ignored, so check the struct before adding one.

hostname = "mail.k8s.elemta.local"
listen_addr = ":2525"
local_domains = ["example.com", "localhost"]
max_size = 26214400  # 25MB

# Loopback only. Not "private": a NodePort or LoadBalancer Service with the
# default externalTrafficPolicy SNATs every client to a node address, which is
# private, so "private" here would make this an open relay. The Services use
# externalTrafficPolicy: Local to keep real client addresses, but relaying is
# still opt-in: list your LAN's CIDR if you want it.
allowed_relays = []

max_connections_per_domain = 20
strict_line_endings = true

[server]
hostname = "mail.k8s.elemta.local"
listen = ":2525"
listen_submission = ":2587"
max_size = 26214400
local_domains = ["example.com", "localhost"]
dev_mode = false

[tls]
enabled = true
enable_starttls = true
# Generated by scripts/prepare-config.sh when ELEMTA_DEV_CERT=true. For a real
# certificate, mount a Secret's tls.crt/tls.key at /app/config/test.crt and
# /app/config/test.key and drop ELEMTA_DEV_CERT; prepare-config.sh stages it.
cert_file = "/app/runtime-config/test.crt"
key_file = "/app/runtime-config/test.key"

[queue]
dir = "/app/queue"
backend = "file"

[queue_processor]
enabled = true
interval = 5
workers = 20

[logging]
level = "info"

[plugins]
directory = "/app/plugins"
enabled = []

# No directory to check SMTP AUTH against, so AUTH is off rather than pointed
# at an LDAP server that is not there.
[auth]
enabled = false
required = false

# Local mail goes over LMTP to elemta-sink (base/sink.yaml), which accepts and
# discards. For real mailboxes, point this at the mailbox service or any LMTP server.
[delivery]
mode = "lmtp"
host = "elemta-sink"
port = 2424
timeout = 30
retry_delay = 60

[access_control]
enabled = true

# Off: Spamhaus refuses queries that arrive through public or cluster
# resolvers, and answers them with a code that reads as "listed".
[rbl]
enabled = false

[plugins.spf]
enabled = true
timeout = 10

[plugins.dkim]
enabled = true
verify = true
sign = false

[plugins.dmarc]
enabled = true
enforce = false
timeout = 10

[plugins.arc]
enabled = true
verify = true
seal = false

[antivirus]
enabled = false

[antispam]
enabled = false

[rate_limiter]
enabled = true
max_connections_per_ip = 100
connection_rate_per_minute = 600
max_messages_per_minute = 300
max_recipients_per_message = 100

[metrics]
enabled = true
listen_addr = ":8080"

[api]
enabled = true
listen_addr = "0.0.0.0:8025"
web_root = "/app/web/static"
auth_enabled = true
auth_file = "/app/runtime-config/users.json"
