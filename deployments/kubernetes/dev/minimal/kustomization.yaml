# The development stack, the Kubernetes equivalent of what
# deployments/compose/docker-compose.yml used to run for `make install-dev`.
#
# Driven by the Makefile, not applied by hand: it reads config/elemta.toml and
# the LDAP, Rspamd and Roundcube files from where they live in the repository,
# which kustomize only allows with --load-restrictor LoadRestrictionsNone, and
# it runs images the Makefile builds and loads into the cluster.
#
#   make install-dev           this directory: Elemta, DNS, LDAP, the mailbox
#                              service and its Postgres, webmail, Valkey, sink
#   make install-dev-full      ../full:     + ClamAV, Rspamd, Roundcube
#   make install-dev-bench     ../bench:    + ClamAV, Rspamd; delivery to the sink
#   make install-dev-postgres  ../postgres: + Postgres for the queue
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: elemta

labels:
  - pairs:
      app.kubernetes.io/part-of: elemta
    includeSelectors: false

resources:
  - ../../base
  - dns.yaml
  - ldap.yaml
  - mailbox.yaml
  - expose.yaml

# The repository's config, as the compose stack bind-mounted it. Not mounted
# live: a ConfigMap is a copy, and the runtime config is a copy of that, so
# `make reseed` (which install-dev runs) is how an edit reaches the server.
configMapGenerator:
  - name: elemta-config
    files:
      - ../../../../config/elemta.toml
  - name: elemta-dns
    files:
      - ../../../dns/unbound.conf
  # Generated from config/mailbox-main.toml by `make k8s-mailbox-config`.
  - name: elemta-mailbox-config
    files:
      - mailbox.toml
  - name: elemta-ldap-init
    files:
      - ../../../../docker/ldap/99-stress-users.ldif
      - ../../../../docker/ldap/demo-complete.ldif

# The development certificate from `make certs`, as the compose stack mounted
# config/test.crt and test.key. Projected next to elemta.toml in /app/config,
# where scripts/prepare-config.sh looks for a host pair. Generated on the host
# rather than in the pod so that `make ensure-dev-certs` can replace it when
# it lapses, which it does every CERT_DAYS.
secretGenerator:
  # Each container's LDAP service-account credentials, from the same files
  # the compose stack uses (scripts/dev-secrets.sh; k8s-install generates
  # them). One Secret per component, so each sees only its own.
  - name: elemta-ldap-smtp
    envs:
      - ../../../compose/.secrets/elemta.env
  - name: elemta-ldap-web
    envs:
      - ../../../compose/.secrets/web.env
  # The mailbox service's LDAP account and its Postgres login; Postgres's own
  # credentials; the webmail's LDAP and recovery-mail accounts.
  - name: elemta-mailbox
    envs:
      - ../../../compose/.secrets/mailbox.env
      - ../../../compose/.secrets/mailbox-client.env
  - name: elemta-mailbox-db
    envs:
      - ../../../compose/.secrets/mailbox-postgres.env
  - name: elemta-webmail
    envs:
      - ../../../compose/.secrets/webmail.env
  # The mailbox service's development certificate (scripts/dev-secrets.sh).
  # Its names include elemta-mailbox, which the MTA verifies for LMTP over TLS.
  - name: elemta-mailbox-tls
    files:
      - cert.pem=../../../compose/.secrets/mailbox-tls/cert.pem
      - key.pem=../../../compose/.secrets/mailbox-tls/key.pem
  - name: elemta-dev-tls
    type: kubernetes.io/tls
    files:
      - tls.crt=../../../../config/test.crt
      - tls.key=../../../../config/test.key

images:
  - name: elemta
    newName: elemta
    newTag: dev
  - name: elemta-dns
    newName: elemta-dns
    newTag: dev
  - name: elemta-mailbox
    newName: elemta-mailbox
    newTag: dev
  - name: elemta-ldap
    newName: elemta-ldap
    newTag: dev

patches:
  - path: patches.yaml
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: elemta
      spec:
        template:
          spec:
            containers:
              # VALKEY_ADDR, as in the compose stack: the dashboard's mail
              # administration needs the shared webmail sessions it revokes,
              # and the MTA counts class-of-service sending limits there so
              # every replica shares one count.
              - name: smtp
                envFrom:
                  - secretRef:
                      name: elemta-ldap-smtp
                env:
                  - name: VALKEY_ADDR
                    value: elemta-valkey:6379
              - name: web
                envFrom:
                  - secretRef:
                      name: elemta-ldap-web
                env:
                  - name: VALKEY_ADDR
                    value: elemta-valkey:6379
  - target:
      kind: Deployment
      name: elemta
    patch: |-
      # By index, so check it is the right one: a reordered base fails the
      # build here instead of replacing the queue volume.
      - op: test
        path: /spec/template/spec/volumes/0/name
        value: config
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: config
          projected:
            # Group-readable: the files are root-owned and the service runs
            # as uid 1001 with fsGroup 1001. prepare-config.sh copies them
            # to 0600 files it owns before anything uses them.
            defaultMode: 0440
            sources:
              - configMap:
                  name: elemta-config
              - secret:
                  name: elemta-dev-tls
                  items:
                    - key: tls.crt
                      path: test.crt
                    - key: tls.key
                      path: test.key
  # After the volume replacement above, which checks volume 0 by index.
  # LMTP to the mailbox service is verified against its certificate
  # (config/elemta.toml: lmtp_tls_ca_file), and SMTP AUTH honours users'
  # "require app passwords" (internal/smtp/app_passwords.go). Webmail pod
  # addresses aren't fixed here, so the whole pod network may use the account
  # password at submission; acceptable for a dev cluster that runs only this.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: elemta
      spec:
        template:
          spec:
            containers:
              - name: smtp
                env:
                  - name: ELEMTA_AUTH_MAILBOX_SECURITY_URL
                    value: http://elemta-mailbox:8080
                  - name: ELEMTA_AUTH_APP_PASSWORD_EXEMPT
                    value: 10.42.0.0/16
                volumeMounts:
                  - name: mailbox-ca
                    mountPath: /app/mailbox-ca.pem
                    subPath: cert.pem
                    readOnly: true
            volumes:
              - name: mailbox-ca
                secret:
                  secretName: elemta-mailbox-tls
                  items:
                    - key: cert.pem
                      path: cert.pem
