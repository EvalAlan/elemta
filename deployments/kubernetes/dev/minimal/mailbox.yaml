# The mail store, as in the Compose stack: the mailbox service (IMAP, POP3,
# LMTP, Sieve, ManageSieve and the account-security API) with its Postgres
# metadata, and the webmail.
#
# Compose runs two named mailbox replicas behind HAProxy. Here the replicas
# are one Deployment, and the elemta-mailbox Service spreads connections
# across them. The replicas share all state through Postgres and the bodies
# volume, which is ReadWriteOnce: fine on this single-node dev cluster, where
# both pods run on the node that holds it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elemta-mailbox-db
  labels:
    app.kubernetes.io/name: elemta-mailbox-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: elemta-mailbox-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elemta-mailbox-db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: elemta-mailbox-db
          env:
            # A subdirectory, because a fresh volume's root may not be empty.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: elemta-mailbox-metadata
---
apiVersion: v1
kind: Service
metadata:
  name: elemta-mailbox-db
  labels:
    app.kubernetes.io/name: elemta-mailbox-db
spec:
  selector:
    app.kubernetes.io/name: elemta-mailbox-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elemta-mailbox
  labels:
    app.kubernetes.io/name: elemta-mailbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: elemta-mailbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elemta-mailbox
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mailbox
          image: elemta-mailbox
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: elemta-mailbox
          ports:
            - { name: imap, containerPort: 1143 }
            - { name: imaps, containerPort: 10993 }
            - { name: imap-starttls, containerPort: 11143 }
            - { name: pop3, containerPort: 1110 }
            - { name: lmtp, containerPort: 2424 }
            - { name: sieve, containerPort: 4190 }
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/elemta/mailbox.toml
              subPath: mailbox.toml
              readOnly: true
            - name: tls
              mountPath: /etc/elemta/tls
              readOnly: true
            - name: bodies
              mountPath: /var/lib/elemta/bodies
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: elemta-mailbox-config
        - name: tls
          secret:
            secretName: elemta-mailbox-tls
            # Group-readable, for uid 1001 through fsGroup.
            defaultMode: 0440
        - name: bodies
          persistentVolumeClaim:
            claimName: elemta-mailbox-bodies
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
# Named like the Compose HAProxy, so config/elemta.toml's LMTP, IMAP and
# ManageSieve addresses (elemta-mailbox:2424, :1143, :4190) work unchanged.
apiVersion: v1
kind: Service
metadata:
  name: elemta-mailbox
  labels:
    app.kubernetes.io/name: elemta-mailbox
spec:
  selector:
    app.kubernetes.io/name: elemta-mailbox
  ports:
    - { name: imap, port: 1143, targetPort: imap }
    - { name: imaps, port: 10993, targetPort: imaps }
    - { name: imap-starttls, port: 11143, targetPort: imap-starttls }
    - { name: pop3, port: 1110, targetPort: pop3 }
    - { name: lmtp, port: 2424, targetPort: lmtp }
    - { name: sieve, port: 4190, targetPort: sieve }
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elemta-webmail
  labels:
    app.kubernetes.io/name: elemta-webmail
spec:
  replicas: 1
  # Recreate: the runtime config volume is ReadWriteOnce.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: elemta-webmail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elemta-webmail
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webmail
          image: elemta
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - exec /app/elemta --config "$(/app/prepare-config.sh)" webmail
          envFrom:
            - secretRef:
                name: elemta-webmail
          env:
            - { name: TZ, value: UTC }
            - { name: NODE_ID, value: webmail }
            # Sessions in Valkey, so a restart doesn't sign anyone out.
            - { name: VALKEY_ADDR, value: "elemta-valkey:6379" }
            # Two-step verification and app passwords (internal/webmail/security.go).
            - { name: ELEMTA_WEBMAIL_SECURITY_URL, value: "http://elemta-mailbox:8080" }
          ports:
            - name: http
              containerPort: 8027
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            # Its own runtime copy of the config, and the key that seals
            # passwords in shared sessions, which must survive restarts.
            - name: runtime-config
              mountPath: /app/runtime-config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: elemta-config
        - name: runtime-config
          persistentVolumeClaim:
            claimName: elemta-webmail-config
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: elemta-webmail
  labels:
    app.kubernetes.io/name: elemta-webmail
spec:
  selector:
    app.kubernetes.io/name: elemta-webmail
  ports:
    - name: http
      port: 8027
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elemta-mailbox-metadata
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elemta-mailbox-bodies
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elemta-webmail-config
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 64Mi
