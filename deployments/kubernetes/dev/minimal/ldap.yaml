# elemta-ldap: the directory behind SMTP AUTH, mailbox and webmail logins, and Roundcube.
#
# The LDIF files are mounted where the compose stack mounted them. osixia's
# image does not load them on its own from there; scripts/init-ldap-if-needed.sh
# does, through kubectl exec, after the pod is ready (install-dev runs it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elemta-ldap
  labels:
    app.kubernetes.io/name: elemta-ldap
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: elemta-ldap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elemta-ldap
    spec:
      hostname: elemta-ldap
      containers:
        - name: openldap
          image: osixia/openldap:latest
          env:
            - name: LDAP_ORGANISATION
              value: Example Corp
            - name: LDAP_DOMAIN
              value: example.com
            # Development only, like everything else in this directory.
            - name: LDAP_ADMIN_PASSWORD
              value: admin
            - name: LDAP_BASE_DN
              value: dc=example,dc=com
            - name: LDAP_TLS_VERIFY_CLIENT
              value: never
            - name: LDAP_RFC2307BIS_SCHEMA
              value: "true"
            - name: LDAP_REMOVE_CONFIG_AFTER_SETUP
              value: "true"
            - name: LDAP_TLS
              value: "false"
          ports:
            - name: ldap
              containerPort: 389
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                # Root over the local socket, as the Compose health check does:
                # the admin password is rotated away from the image default
                # (scripts/ldap-admin-password.sh), so a probe that binds with
                # it marks a working directory unready.
                - ldapsearch -Q -Y EXTERNAL -H ldapi:/// -b 'dc=example,dc=com' -s base -LLL dn >/dev/null
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/ldap
            - name: config
              mountPath: /etc/ldap/slapd.d
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: elemta-ldap-data
        - name: config
          persistentVolumeClaim:
            claimName: elemta-ldap-config
        - name: init
          configMap:
            name: elemta-ldap-init
---
apiVersion: v1
kind: Service
metadata:
  name: elemta-ldap
  labels:
    app.kubernetes.io/name: elemta-ldap
spec:
  selector:
    app.kubernetes.io/name: elemta-ldap
  ports:
    - name: ldap
      port: 389
      targetPort: ldap
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elemta-ldap-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elemta-ldap-config
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 64Mi
