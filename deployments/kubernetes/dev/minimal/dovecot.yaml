# elemta-dovecot: the mailboxes local mail is delivered to over LMTP, read over
# IMAP by Roundcube. Built from docker/dovecot by `make k8s-images`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elemta-dovecot
  labels:
    app.kubernetes.io/name: elemta-dovecot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: elemta-dovecot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elemta-dovecot
    spec:
      hostname: elemta-dovecot
      # Mailboxes are created as vmail (uid 5000) under /var/mail. Docker
      # seeded a new named volume from the image, which already owned it; a
      # PersistentVolume starts empty and root-owned, so hand it over first.
      initContainers:
        - name: mail-owner
          image: elemta-dovecot
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "chown 5000:5000 /var/mail && chmod 700 /var/mail"]
          volumeMounts:
            - name: mail
              mountPath: /var/mail
      containers:
        - name: dovecot
          image: elemta-dovecot
          imagePullPolicy: IfNotPresent
          ports:
            - name: imap
              containerPort: 14143
            - name: lmtp
              containerPort: 2424
            - name: sieve
              containerPort: 4190
          readinessProbe:
            tcpSocket:
              port: imap
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: mail
              mountPath: /var/mail
      volumes:
        - name: mail
          persistentVolumeClaim:
            claimName: elemta-dovecot-mail
---
apiVersion: v1
kind: Service
metadata:
  name: elemta-dovecot
  labels:
    app.kubernetes.io/name: elemta-dovecot
spec:
  selector:
    app.kubernetes.io/name: elemta-dovecot
  ports:
    - name: imap
      port: 14143
      targetPort: imap
    - name: lmtp
      port: 2424
      targetPort: lmtp
    - name: sieve
      port: 4190
      targetPort: sieve
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elemta-dovecot-mail
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
