# elemta-dns: the caching, DNSSEC-validating resolver. Why it exists is in
# deployments/dns/unbound.conf.
#
# Its Service has a fixed ClusterIP because pods name a resolver by address,
# not by name: dnsConfig.nameservers takes IPs, and resolving the resolver's
# name would need a resolver. 10.43.53.53 is inside k3s's default service range
# (10.43.0.0/16); on a cluster with a different range, change it here and in
# patches.yaml and components/scanners.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elemta-dns
  labels:
    app.kubernetes.io/name: elemta-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elemta-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elemta-dns
    spec:
      containers:
        - name: unbound
          image: elemta-dns
          imagePullPolicy: IfNotPresent
          ports:
            - name: dns
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
          readinessProbe:
            exec:
              command: ["sh", "-c", "nslookup -type=NS . 127.0.0.1 >/dev/null"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/unbound/unbound.conf
              subPath: unbound.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: elemta-dns
---
apiVersion: v1
kind: Service
metadata:
  name: elemta-dns
  labels:
    app.kubernetes.io/name: elemta-dns
spec:
  clusterIP: 10.43.53.53
  selector:
    app.kubernetes.io/name: elemta-dns
  ports:
    - name: dns
      port: 53
      targetPort: dns
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
