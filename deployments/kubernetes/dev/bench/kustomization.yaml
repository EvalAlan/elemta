# make install-dev-bench: everything that scans, nothing that stores. No
# Roundcube, because delivery goes to the sink and there is nothing to read.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Repeated here because minimal's transformers do not reach the components.
namespace: elemta
labels:
  - pairs:
      app.kubernetes.io/part-of: elemta
    includeSelectors: false

resources:
  - ../minimal
components:
  - ../components/scanners
