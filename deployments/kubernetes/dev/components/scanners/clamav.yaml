# elemta-clamav. The signature database lives on a volume because downloading
# it is the slow part of every start; a fresh one takes a few minutes before
# clamd listens, which is what the generous startup probe is for.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elemta-clamav
  labels:
    app.kubernetes.io/name: elemta-clamav
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: elemta-clamav
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elemta-clamav
    spec:
      containers:
        - name: clamav
          image: clamav/clamav:latest
          ports:
            - name: clamd
              containerPort: 3310
          startupProbe:
            tcpSocket:
              port: clamd
            periodSeconds: 15
            failureThreshold: 40
          readinessProbe:
            tcpSocket:
              port: clamd
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 3Gi
          securityContext:
            capabilities:
              drop: ["NET_RAW"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/clamav
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: elemta-clamav-data
---
apiVersion: v1
kind: Service
metadata:
  name: elemta-clamav
  labels:
    app.kubernetes.io/name: elemta-clamav
spec:
  selector:
    app.kubernetes.io/name: elemta-clamav
  ports:
    - name: clamd
      port: 3310
      targetPort: clamd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elemta-clamav-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
