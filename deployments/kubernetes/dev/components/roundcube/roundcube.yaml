apiVersion: apps/v1
kind: Deployment
metadata:
  name: elemta-roundcube
  labels:
    app.kubernetes.io/name: elemta-roundcube
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: elemta-roundcube
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elemta-roundcube
    spec:
      containers:
        - name: roundcube
          image: roundcube/roundcubemail:latest
          env:
            - { name: ROUNDCUBEMAIL_DB_TYPE, value: sqlite }
            - { name: ROUNDCUBEMAIL_SKIN, value: elastic }
            - { name: ROUNDCUBEMAIL_DEFAULT_HOST, value: elemta-dovecot }
            - { name: ROUNDCUBEMAIL_DEFAULT_PORT, value: "14143" }
            - { name: ROUNDCUBEMAIL_SMTP_SERVER, value: "tls://elemta" }
            - { name: ROUNDCUBEMAIL_SMTP_PORT, value: "2525" }
            - { name: ROUNDCUBEMAIL_SMTP_AUTH_TYPE, value: PLAIN }
            - { name: ROUNDCUBEMAIL_SMTP_USER, value: "%u" }
            - { name: ROUNDCUBEMAIL_SMTP_PASS, value: "%p" }
            - { name: ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE, value: 25M }
            - { name: ROUNDCUBEMAIL_ASPELL_ENABLE, value: "true" }
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/roundcube
            # STARTTLS options for submitting to Elemta; see the file for why.
            - name: config
              mountPath: /var/roundcube/config/elemta-smtp.inc.php
              subPath: elemta-smtp.inc.php
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: elemta-roundcube-data
        - name: config
          configMap:
            name: elemta-roundcube
---
apiVersion: v1
kind: Service
metadata:
  name: elemta-roundcube
  labels:
    app.kubernetes.io/name: elemta-roundcube
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: elemta-roundcube
  ports:
    - name: http
      port: 8026
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elemta-roundcube-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
