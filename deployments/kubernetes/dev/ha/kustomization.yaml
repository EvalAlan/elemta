# The replicated deployment (../../ha) on this machine's single-node k3s,
# with the dev stack's configuration, fixtures and secrets:
#
#   make k8s-install-ha
#
# Postgres, Valkey and the directory keep their replicated topology for
# failover drills. The services and scanners run one pod each to fit this
# single node; raise their replica counts for scaling and rolling-update
# drills.
#
# Images come from a registry on localhost:5000 (make k8s-ha-images), which
# k3s pulls from without root, unlike an image import.
#
# Admin and webmail are reached as in production, over HTTPS through the
# HAProxy ingress (../../production/edge), at https://admin.elemta.test and
# https://webmail.elemta.test; mail keeps this machine's host ports.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: elemta

labels:
  - pairs:
      app.kubernetes.io/part-of: elemta
    includeSelectors: false

resources:
  - namespace.yaml
  - ../../ha
  - ../minimal/dns.yaml
  - objects.yaml
  - expose.yaml
  - edge-ca.yaml

components:
  - ../../production/edge

configMapGenerator:
  # Generated from config/elemta.toml by `make k8s-ha-config`: HTTPS
  # origins, the certificates cert-manager issues, and HAProxy trusted for
  # client addresses.
  - name: elemta-config
    files:
      - elemta.toml
  - name: elemta-dns
    files:
      - ../../../dns/unbound.conf
  # Generated from config/mailbox-main.toml by `make k8s-ha-mailbox-config`:
  # bodies in S3, synchronous replication required, the pod network
  # allowed to deliver.
  - name: elemta-mailbox-config
    files:
      - mailbox.toml
  # Rspamd's module settings, as Compose mounts them. Its Valkey and Bayes
  # files come from ../../ha.
  - name: elemta-rspamd-override
    files:
      - ../../../../docker/rspamd/override.d/options.inc
  - name: elemta-rspamd-local
    files:
      - ../../../../docker/rspamd/local.d/greylist.conf
      - ../../../../docker/rspamd/local.d/actions.conf
      - ../../../../docker/rspamd/local.d/worker-controller.inc
      - ../../../../docker/rspamd/local.d/url_suspect_group.conf
  - name: elemta-ldap-init
    files:
      - ../../../../docker/ldap/99-stress-users.ldif
      - ../../../../docker/ldap/demo-complete.ldif

# The dev stack's credentials (scripts/dev-secrets.sh), plus the ones only
# this overlay needs, generated by `make k8s-ha-secrets` into
# deployments/compose/.secrets/k8s-ha/.
secretGenerator:
  - name: elemta-ldap-admin
    envs:
      - ../../../compose/.secrets/ldap-admin.env
  - name: elemta-ldap-smtp
    envs:
      - ../../../compose/.secrets/elemta.env
  - name: elemta-ldap-web
    envs:
      - ../../../compose/.secrets/web.env
  - name: elemta-mailbox
    envs:
      - ../../../compose/.secrets/mailbox.env
  - name: elemta-rspamd
    envs:
      - ../../../compose/.secrets/rspamd.env
  - name: elemta-webmail
    envs:
      - ../../../compose/.secrets/webmail.env
  - name: elemta-mailbox-s3
    envs:
      - ../../../compose/.secrets/k8s-ha/s3.env
  # CloudNativePG reads these as basic-auth secrets (username, password).
  - name: elemta-db-mailbox
    type: kubernetes.io/basic-auth
    # Without the hash suffix: the Cluster refers to it by name, in a
    # resource kustomize doesn't rewrite references in.
    options:
      disableNameSuffixHash: true
    envs:
      - ../../../compose/.secrets/k8s-ha/db-mailbox.env
  - name: elemta-db-queue
    type: kubernetes.io/basic-auth
    # Without the hash suffix: the Cluster refers to it by name, in a
    # resource kustomize doesn't rewrite references in.
    options:
      disableNameSuffixHash: true
    envs:
      - ../../../compose/.secrets/k8s-ha/db-queue.env

images:
  # ../../ha has already named it after the published image.
  - name: ghcr.io/evalalan/elemta
    newName: localhost:5000/elemta
    newTag: dev
  # ../../ha has already named it after the published image.
  - name: ghcr.io/evalalan/elemta-mailbox
    newName: localhost:5000/elemta-mailbox
    newTag: dev
  # ../../ha has already named it after the published image.
  - name: ghcr.io/evalalan/elemta-ldap
    newName: localhost:5000/elemta-ldap
    newTag: dev
  - name: elemta-dns
    newName: localhost:5000/elemta-dns
    newTag: dev
  - name: ghcr.io/evalalan/elemta-valkey
    newName: localhost:5000/elemta-valkey
    newTag: 8.0.11-errqueue.1

patches:
  # CPU autoscaling can leave a quiet development stack at ten MTA and
  # mailbox pods during load tests. Keep the local footprint predictable.
  - target:
      kind: HorizontalPodAutoscaler
      name: elemta-mta|elemta-mailbox|elemta-webmail
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1
  - target:
      kind: Deployment
      name: elemta-admin|elemta-mailbox|elemta-rspamd|elemta-webmail
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: StatefulSet
      name: elemta-mta|elemta-clamav
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # local-path volumes are ReadWriteOnce, which every pod on this one node
  # can mount; a multi-node cluster needs ReadWriteMany here instead.
  - target:
      kind: PersistentVolumeClaim
      name: elemta-runtime-config
    patch: |-
      - op: replace
        path: /spec/accessModes
        value: ["ReadWriteOnce"]
  # Images are rebuilt under the same tag; always pull so a restart runs the
  # new one.
  - target:
      kind: Deployment
      name: elemta-admin|elemta-webmail|elemta-mailbox
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: StatefulSet
      name: elemta-mta|elemta-ldap
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  # The mail certificate next to elemta.toml too, where
  # scripts/prepare-config.sh takes a host pair from; otherwise it makes a
  # self-signed one. The MTA serves the renewable mount the edge adds
  # (/app/public-tls), per the generated config. By index, so check it is the
  # right volume first.
  - target:
      kind: StatefulSet
      name: elemta-mta
    patch: |-
      - op: test
        path: /spec/template/spec/volumes/0/name
        value: config
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: config
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: elemta-config
              - secret:
                  name: elemta-mail-tls
                  items:
                    - { key: tls.crt, path: test.crt }
                    - { key: tls.key, path: test.key }
  - target:
      kind: Deployment
      name: elemta-admin|elemta-webmail
    patch: |-
      - op: test
        path: /spec/template/spec/volumes/0/name
        value: config
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: config
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: elemta-config
              - secret:
                  name: elemta-mail-tls
                  items:
                    - { key: tls.crt, path: test.crt }
                    - { key: tls.key, path: test.key }
  - path: patches.yaml
  # A CA this overlay makes (edge-ca.yaml) in place of Let's Encrypt.
  - target:
      kind: Issuer
      name: elemta-public
    patch: |-
      - op: remove
        path: /spec/acme
      - op: add
        path: /spec/ca
        value: { secretName: elemta-dev-ca }
  # The component has already put its example names in, before anything
  # here runs, so its settings are corrected only so the cluster's copy
  # tells the truth; the patches after this one change the names. The mail
  # certificate also names the services the MTA and webmail reach the
  # mailbox and MTA by, so LMTP verifies against it.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: elemta-edge-settings
      data:
        MAIL_HOST: mail.elemta.test
        ADMIN_HOST: admin.elemta.test
        WEBMAIL_HOST: webmail.elemta.test
        ACME_EMAIL: postmaster@elemta.test
  - target:
      kind: Certificate
      name: elemta-mail-tls
    patch: |-
      - op: replace
        path: /spec/dnsNames
        value: [mail.elemta.test, elemta-mailbox, elemta]
  - target:
      kind: Certificate
      name: elemta-web-tls
    patch: |-
      - op: replace
        path: /spec/dnsNames
        value: [admin.elemta.test, webmail.elemta.test]
  - target:
      kind: Ingress
      name: elemta-admin
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: admin.elemta.test
      - op: replace
        path: /spec/tls/0/hosts/0
        value: admin.elemta.test
  - target:
      kind: Ingress
      name: elemta-webmail
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: webmail.elemta.test
      - op: replace
        path: /spec/tls/0/hosts/0
        value: webmail.elemta.test
  # Mail stays on this machine's dev ports (expose.yaml); the public ones
  # would take 993 and 4190 from them and bind 25 on the workstation.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: elemta-mail-public
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: elemta-mailbox-public
