# The replicated deployment (../../ha) on this machine's single-node k3s,
# with the dev stack's configuration, fixtures and secrets:
#
#   make k8s-install-ha
#
# Everything is replicated as it would be across nodes (three Postgres
# instances with synchronous replication, three Valkeys with Sentinels, two
# directory nodes, two of each Elemta service), so failover, scaling and
# rolling updates can be exercised here. They share one node, so losing the
# node is the one failure this can't show.
#
# Images come from a registry on localhost:5000 (make k8s-ha-images), which
# k3s pulls from without root, unlike an image import.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: elemta

labels:
  - pairs:
      app.kubernetes.io/part-of: elemta
    includeSelectors: false

resources:
  - namespace.yaml
  - ../../ha
  - ../minimal/dns.yaml
  - objects.yaml
  - expose.yaml

configMapGenerator:
  - name: elemta-config
    files:
      - ../../../../config/elemta.toml
  - name: elemta-dns
    files:
      - ../../../dns/unbound.conf
  # Generated from config/mailbox-main.toml by `make k8s-ha-mailbox-config`:
  # bodies in S3, synchronous replication required, the pod network
  # allowed to deliver.
  - name: elemta-mailbox-config
    files:
      - mailbox.toml
  - name: elemta-ldap-init
    files:
      - ../../../../docker/ldap/99-stress-users.ldif
      - ../../../../docker/ldap/demo-complete.ldif

# The dev stack's credentials (scripts/dev-secrets.sh), plus the ones only
# this overlay needs, generated by `make k8s-ha-secrets` into
# deployments/compose/.secrets/k8s-ha/.
secretGenerator:
  - name: elemta-ldap-admin
    envs:
      - ../../../compose/.secrets/ldap-admin.env
  - name: elemta-ldap-smtp
    envs:
      - ../../../compose/.secrets/elemta.env
  - name: elemta-ldap-web
    envs:
      - ../../../compose/.secrets/web.env
  - name: elemta-mailbox
    envs:
      - ../../../compose/.secrets/mailbox.env
  - name: elemta-webmail
    envs:
      - ../../../compose/.secrets/webmail.env
  - name: elemta-mailbox-s3
    envs:
      - ../../../compose/.secrets/k8s-ha/s3.env
  # CloudNativePG reads these as basic-auth secrets (username, password).
  - name: elemta-db-mailbox
    type: kubernetes.io/basic-auth
    # Without the hash suffix: the Cluster refers to it by name, in a
    # resource kustomize doesn't rewrite references in.
    options:
      disableNameSuffixHash: true
    envs:
      - ../../../compose/.secrets/k8s-ha/db-mailbox.env
  - name: elemta-db-queue
    type: kubernetes.io/basic-auth
    # Without the hash suffix: the Cluster refers to it by name, in a
    # resource kustomize doesn't rewrite references in.
    options:
      disableNameSuffixHash: true
    envs:
      - ../../../compose/.secrets/k8s-ha/db-queue.env
  - name: elemta-mailbox-tls
    files:
      - cert.pem=../../../compose/.secrets/mailbox-tls/cert.pem
      - key.pem=../../../compose/.secrets/mailbox-tls/key.pem
  - name: elemta-dev-tls
    type: kubernetes.io/tls
    files:
      - tls.crt=../../../../config/test.crt
      - tls.key=../../../../config/test.key

images:
  # ../../ha has already named it after the published image.
  - name: ghcr.io/evalalan/elemta
    newName: localhost:5000/elemta
    newTag: dev
  # ../../ha has already named it after the published image.
  - name: ghcr.io/evalalan/elemta-mailbox
    newName: localhost:5000/elemta-mailbox
    newTag: dev
  # ../../ha has already named it after the published image.
  - name: ghcr.io/evalalan/elemta-ldap
    newName: localhost:5000/elemta-ldap
    newTag: dev
  - name: elemta-dns
    newName: localhost:5000/elemta-dns
    newTag: dev

patches:
  # local-path volumes are ReadWriteOnce, which every pod on this one node
  # can mount; a multi-node cluster needs ReadWriteMany here instead.
  - target:
      kind: PersistentVolumeClaim
      name: elemta-runtime-config
    patch: |-
      - op: replace
        path: /spec/accessModes
        value: ["ReadWriteOnce"]
  # Images are rebuilt under the same tag; always pull so a restart runs the
  # new one.
  - target:
      kind: Deployment
      name: elemta|elemta-web|elemta-webmail|elemta-mailbox
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: StatefulSet
      name: elemta-ldap
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  # The development certificate next to elemta.toml, where
  # scripts/prepare-config.sh takes a host pair from. By index, so check it
  # is the right volume first.
  - target:
      kind: Deployment
      name: elemta|elemta-web|elemta-webmail
    patch: |-
      - op: test
        path: /spec/template/spec/volumes/0/name
        value: config
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: config
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: elemta-config
              - secret:
                  name: elemta-dev-tls
                  items:
                    - { key: tls.crt, path: test.crt }
                    - { key: tls.key, path: test.key }
  - path: patches.yaml
