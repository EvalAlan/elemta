# S3 for the mailbox bodies on a test cluster: one SeaweedFS in its
# all-in-one mode, as the Compose stack's s3 profile runs it. Not itself
# replicated; a real cluster points mailbox.toml at a replicated store
# (SeaweedFS with several volume servers, Ceph RGW, a cloud bucket).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elemta-objects
  labels:
    app.kubernetes.io/name: elemta-objects
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: elemta-objects
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elemta-objects
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          args: [mini, -dir=/data]
          envFrom:
            # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, the same pair the
            # mailbox service is given.
            - secretRef:
                name: elemta-mailbox-s3
          env:
            - { name: S3_BUCKET, value: mailbox-dev }
          ports:
            - { name: s3, containerPort: 8333 }
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: elemta-objects
---
apiVersion: v1
kind: Service
metadata:
  name: elemta-objects
  labels:
    app.kubernetes.io/name: elemta-objects
spec:
  selector:
    app.kubernetes.io/name: elemta-objects
  ports:
    - { name: s3, port: 8333, targetPort: s3 }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elemta-objects
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
