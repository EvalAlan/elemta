# The MTA uses the caching DNSSEC resolver (../minimal/dns.yaml), as in the
# other dev overlays, and shows the dev stack's demo data.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elemta-mta
spec:
  template:
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers: ["10.43.53.53"]
        searches:
          - elemta.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "5"
      containers:
        - name: smtp
          env:
            - { name: ELEMTA_DEMO_DATA, value: "true" }
            - { name: ELEMTA_HOSTNAME, value: mail.elemta.test }
            - { name: NODE_ID, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elemta-admin
spec:
  template:
    spec:
      containers:
        - name: admin
          env:
            - { name: ELEMTA_DEMO_DATA, value: "true" }
            # Where Open mailbox sends the administrator.
            - { name: ELEMTA_WEBMAIL_PUBLIC_URL, value: "https://webmail.elemta.test" }
            - { name: NODE_ID, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
---
# Rspamd makes more DNS lookups per message than anything else (RBLs,
# SURBLs, ASN); through the caching resolver, as the MTA does.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elemta-rspamd
spec:
  template:
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers: ["10.43.53.53"]
        searches:
          - elemta.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "5"
