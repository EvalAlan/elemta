# Caching, validating resolver for the dev stack (elemta-dns).
#
# Without it the containers resolve through Docker to the host's resolver, and
# from there to whatever the host uses: a home router, a VPN's DNS server. Every
# message costs Elemta several lookups (SPF, DMARC, DKIM keys) and rspamd more,
# none of them cached. A corpus stress run at ~40 msg/s pushed systemd-resolved
# past its concurrent-query limit behind a VPN, lookups stalled in waves, and
# the run measured the host's DNS rather than the MTA.
#
# This resolves from the root servers itself, caches, and validates DNSSEC. It
# answers only inside the compose network; nothing publishes its port.
server:
    interface: 0.0.0.0
    port: 53
    do-ip6: no
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow

    username: ""
    chroot: ""
    directory: "/etc/unbound"
    logfile: ""
    use-syslog: no
    verbosity: 1

    # A stress run issues hundreds of lookups a second, many for the same few
    # names. Room for them in flight, and answers kept warm.
    num-threads: 2
    num-queries-per-thread: 1024
    outgoing-range: 2048
    msg-cache-size: 64m
    rrset-cache-size: 128m
    prefetch: yes
    # An expired answer now beats a fresh one in seconds when an upstream
    # stalls; the cache refreshes behind it.
    serve-expired: yes
    serve-expired-ttl: 3600

    # DNSSEC validation, so the AD bit means something to DANE's resolver.
    module-config: "validator iterator"
    trust-anchor-file: "/etc/unbound/root.key"
    harden-dnssec-stripped: yes
