# Dovecot 2.4 configuration for Elemta development.
dovecot_config_version = 2.4.1
dovecot_storage_version = 2.4.1

protocols = imap lmtp sieve
listen = *

# Development only: no TLS, and passwords over plain connections.
ssl = no
auth_allow_cleartext = yes
auth_mechanisms = plain login
auth_verbose = yes

# Mail is Maildir in /var/mail/<address>. Each user's home, which holds
# Sieve scripts and delivery state, is separate (/var/mail/home/<address>),
# so that state is never mistaken for mail folders.
mail_driver = maildir
mail_path = /var/mail/%{user}

# Users and passwords come from the dev LDAP. Passwords are checked by
# binding as the user, so Dovecot never sees the stored hashes.
ldap_uris = ldap://elemta-ldap:389
ldap_auth_dn = cn=admin,dc=example,dc=com
ldap_auth_dn_password = admin
ldap_base = ou=people,dc=example,dc=com
ldap_scope = subtree
ldap_deref = never

passdb ldap {
  bind = yes
  filter = (&(objectClass=posixAccount)(mail=%{user})(|(!(accountStatus=*))(accountStatus=active)))
}
userdb ldap {
  filter = (&(objectClass=posixAccount)(|(mail=%{user})(mailAlternateAddress=%{user}))(|(!(accountStatus=*))(accountStatus=active)))
  # Listing every user (doveadm -A, used by `make dovecot-index`).
  iterate_filter = (&(objectClass=posixAccount)(mail=*))
  iterate_fields {
    user = %{ldap:mail}
  }
  fields {
    uid = 5000
    gid = 5000
    # LMTP aliases must resolve to the primary mailbox, never a second Maildir.
    user = %{ldap:mail}
    home = /var/mail/home/%{ldap:mail}
    mail_path = /var/mail/%{ldap:mail}
    quota_storage_size = %{ldap:mailQuotaSize | default('0')}B
  }
}

# The standard folders exist for every mailbox from its first login, marked
# with their special use (RFC 6154) so every client, the webmail included,
# knows which folder is Trash or Junk whatever it is called.
namespace inbox {
  inbox = yes
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Archive {
    auto = no
    special_use = \Archive
  }
}

# Full-text search. IMAP SEARCH BODY/TEXT (what the webmail's search box
# sends) is answered from a per-mailbox Xapian index instead of reading
# every message. New mail is indexed as it is delivered; existing mail is
# indexed the first time a folder is searched, or ahead of time with
# `doveadm index` (see docker/dovecot/README.md). Words match whole or by
# prefix ("invoice" finds "invoices"). Full substring matching is left off:
# it made the index about four times the size of the mail it covers.
mail_plugins {
  quota = yes
  fts = yes
  fts_flatcurve = yes
}
fts_autoindex = yes
fts_autoindex_max_recent_msgs = 999
fts_search_add_missing = yes
fts flatcurve {
  substring_search = no
}
language en {
  default = yes
}
language_tokenizers = generic email-address

service imap-login {
  inet_listener imap {
    port = 14143
  }
}
service lmtp {
  inet_listener lmtp {
    port = 2424
  }
}
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}
# Indexing runs in its own processes, so a large backlog doesn't hold up
# IMAP sessions.
service indexer-worker {
  process_limit = 4
}

# Dovecot limits each user's connections per source address (10 by
# default). Every webmail session is one connection, and all of them come
# from the webmail's single address, so the default capped a user at ten
# browsers, tabs that signed in separately, and phones combined.
quota "Mailbox quota" {
  driver = count
}

protocol imap {
  mail_plugins {
    imap_quota = yes
  }
  mail_max_userip_connections = 50
}

# Connections. Each IMAP connection is a process, and Dovecot's default
# cap is 100 processes per service. The webmail holds one connection per
# signed-in session plus an IDLE connection or two per open tab for new-mail
# push, so 100 would serve only a few dozen people. Connections that sit in
# IDLE for 30 seconds are handed to the shared imap-hibernate process, which
# keeps them open for a few kilobytes each and wakes them when mail arrives.
# Size process_limit for the active connections and memory you have.
imap_hibernate_timeout = 30s
service imap {
  process_limit = 2000
  unix_listener imap-master {
    user = dovecot
  }
}
service imap-hibernate {
  process_limit = 10
  client_limit = 10000
  unix_listener imap-hibernate {
    mode = 0660
    group = vmail
  }
}

# Sieve runs at delivery, so the filters and out-of-office reply the webmail
# stores over ManageSieve take effect.
protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}
# Scripts live in the user's home (not their Maildir), with the active one
# linked as ~/.dovecot.sieve.
sieve_script personal {
  driver = file
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}
# Vacation replies and redirects are handed to Elemta's SMTP listener; the
# image has no local sendmail.
submission_host = elemta:2525
postmaster_address = postmaster@example.com

log_path = /var/log/dovecot.log
info_log_path = /var/log/dovecot-info.log
