# Minimal Dovecot configuration for Elemta development
protocols = imap lmtp sieve
listen = *

# Disable SSL for development
ssl = no
disable_plaintext_auth = no

# Mail storage
mail_location = maildir:~/

# The standard folders exist for every mailbox from its first login, marked
# with their special use (RFC 6154) so every client, the webmail included,
# knows which folder is Trash or Junk whatever it is called.
namespace inbox {
  inbox = yes
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Archive {
    auto = no
    special_use = \Archive
  }
}

# Authentication mechanisms
auth_mechanisms = plain login
auth_verbose = yes
auth_debug = yes

# LDAP authentication
passdb {
  driver = ldap
  args = /etc/dovecot/dovecot-ldap.conf.ext
}
userdb {
  driver = ldap
  args = /etc/dovecot/dovecot-ldap.conf.ext
}

# IMAP service
service imap-login {
  inet_listener imap {
    address = 0.0.0.0
    port = 14143
  }
}

# LMTP service
service lmtp {
  inet_listener lmtp {
    port = 2424
  }
}

# Sieve runs at delivery, so the filters and out-of-office reply the webmail
# stores over ManageSieve (port 4190) take effect.
protocol lmtp {
  mail_plugins = $mail_plugins sieve
}
plugin {
  # The active-script link lives beside the user's home, not in it: mail is
  # Maildir at the home's root, where a ".dovecot.sieve" link would show up
  # as folders named "dovecot" and "dovecot.sieve". %h (the home path) is
  # the same however the user signed in, unlike %u, which is "recipient"
  # over ManageSieve but "recipient@example.com" at LMTP delivery.
  sieve = file:~/sieve;active=%h.sieve
}
# Vacation replies and redirects are handed to Elemta's SMTP listener; the
# image has no local sendmail. Replies to outside addresses need Elemta to
# allow relay from the Docker network.
submission_host = elemta:2525
postmaster_address = postmaster@example.com

# Logging
log_path = /var/log/dovecot.log
info_log_path = /var/log/dovecot-info.log
debug_log_path = /var/log/dovecot-debug.log
mail_debug = yes