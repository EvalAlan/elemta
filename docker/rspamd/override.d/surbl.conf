# Local development stack: disable external DNS blocklist lookups.
#
# Rspamd queries zen.spamhaus.org, dbl.spamhaus.org and similar on every
# message. On this stack those lookups are unreliable — rspamd's own monitoring
# reports "DNS reply returned 'no error' ... while 'no records with this name'
# was expected", meaning the resolver answers for names that should not exist,
# so rspamd cannot tell a working blocklist from a broken one.
#
# The effect is that some messages resolve quickly and others wait for a
# timeout, which made throughput here bimodal: repeated identical runs landed
# at either ~25 or ~200 messages a second with nothing between.
#
# Disabling these makes the stack deterministic and lets it run without
# internet access. Everything not dependent on the outside world still runs.
# A deployment that wants blocklist checks should not mount this.
enabled = false;
