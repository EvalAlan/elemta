# Local development stack: disable fuzzy hash lookups.
#
# fuzzy_check queries rspamd.com's fuzzy storage over UDP on every message.
# On this stack those queries are the dominant source of latency: about 5% of
# messages waited roughly 4.3 seconds inside rspamd, which is what made
# throughput bimodal — repeated identical runs landed either around 25 or
# around 200 messages a second with nothing between.
#
# Measured at 100 concurrent connections, same build, only this module
# differing:
#
#                        enabled          disabled
#   throughput            95.4            155-235   msg/s
#   p95 (client)          4.24            0.62-1.14 s
#   p95 (server-side)     4200            491       ms
#   spread across runs    26-212 (8x)     155-235 (1.5x)
#
# Everything local still runs: GTUBE, headers, MIME structure, Bayes and the
# scoring pipeline are unchanged, and a probe returns the same symbols.
#
# This is a development-stack override. Fuzzy hashing is genuinely useful
# against bulk mail, so a deployment that wants it should not mount this — but
# it should know the latency it adds when the fuzzy servers are slow to answer.
enabled = false;
