# Redis backend for Rspamd, kept separate from account security state.
#
# Rspamd's Bayes classifier needs somewhere to keep its tokens, and without a
# Redis backend it silently keeps nothing: the classifier loads, scanning
# works, and `rspamc stat` reports "Messages learned: 0" forever. That is what
# the dev stack did — 95,786 messages scanned, none learned, so the spam score
# was decided entirely by infrastructure symbols.
#
# A dedicated instance lets scanner cache pressure evict expendable keys
# without removing sessions or account revocation markers.
servers = "elemta-rspamd-valkey:6379";
db = "0";

# This instance uses allkeys-lru for scanner cache data. The security store
# uses noeviction and fails writes visibly when it reaches its capacity.
