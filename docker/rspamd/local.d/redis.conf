# Redis backend for Rspamd, pointed at the Valkey already in the dev stack.
#
# Rspamd's Bayes classifier needs somewhere to keep its tokens, and without a
# Redis backend it silently keeps nothing: the classifier loads, scanning
# works, and `rspamc stat` reports "Messages learned: 0" forever. That is what
# the dev stack did — 95,786 messages scanned, none learned, so the spam score
# was decided entirely by infrastructure symbols.
#
# Database 5, not 0. Elemta uses db0 for rate limiting and per-domain metrics,
# and a shared keyspace means one component's FLUSHDB is another's outage.
servers = "elemta-valkey:6379";
db = "5";

# Valkey runs with maxmemory-policy allkeys-lru in this stack, which means
# Bayes tokens can be evicted under memory pressure. The classifier does not
# report that; it just gets quietly worse. Fine for development. For anything
# real, give Rspamd its own Redis with noeviction, or accept that the filter
# degrades silently exactly when the machine is busiest.
