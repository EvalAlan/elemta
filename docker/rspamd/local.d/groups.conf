# A numeric URL alone is not enough to refuse a message. The Enron ham
# corpus contains ordinary newsletters with image and tracking links to IP
# addresses; the shipped weight of 9 plus DATE_IN_PAST crosses our reject
# threshold of 10 even without another spam signal. Keep the symbol visible
# and scored, but require other evidence before rejecting.
symbols {
  "URL_NUMERIC_IP" {
    weight = 5.0;
  }
}
