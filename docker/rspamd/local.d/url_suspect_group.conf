# A numeric URL alone is not enough to refuse a message. Ordinary archived
# newsletters contain image and tracking links to IP addresses; the shipped
# weight of 9 plus DATE_IN_PAST crosses our reject threshold of 10 without
# any other spam signal. Keep the symbol scored, but require other evidence.
symbols {
  "URL_NUMERIC_IP" {
    weight = 5.0;
  }
}
