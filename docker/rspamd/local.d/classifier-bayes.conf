# Bayes classifier.
#
# Without this the dev stack has no statistical filter at all, and the spam
# score reduces to a sum of infrastructure penalties — unknown HELO hostname,
# missing Message-ID, missing or past Date, no SPF or DKIM. Those punish
# *replayed corpus mail* rather than spam, which is how this stack came to
# score real Enron ham (median 6.00) higher than real spam (median 4.00).
#
# Train it with: make rspamd-train

backend = "redis";

# Learning is explicit. Autolearn on an untrained classifier teaches it
# whatever the current rules already believe, which here would mean learning
# that "no SPF" means spam and reinforcing the exact bias that made the filter
# useless. Train from a labelled corpus instead.
autolearn = false;

# Bayes contributes nothing until it has seen this many of each class, which is
# the honest default: a classifier trained on a handful of messages is
# confident and wrong. If BAYES_* symbols never fire, check `rspamc stat`
# against this number before assuming the configuration is broken.
min_learns = 200;
