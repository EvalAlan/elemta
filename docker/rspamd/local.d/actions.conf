# Score thresholds for Rspamd's actions.
#
# reject drops from Rspamd's default of 15 to 10. This is the lever that decides
# how much spam Elemta refuses, because Elemta honours the action rather than
# re-deciding from the raw score: `reject` is refused with 554, everything at
# `add_header` is delivered carrying its spam headers.
#
# 15 refused almost nothing real. Measured by sending real mail through SMTP:
# of 150 messages from the 2026 untroubled spam corpus, 1 was rejected and 149
# were delivered. GTUBE reaches 15 by design, so the corpus test looked like
# spam rejection worked while real spam walked through.
#
# 10 comes from a held-out measurement on the trained Bayes classifier — 80
# Enron ham against 80 untroubled spam, scored after training on messages the
# classifier had never seen:
#
#   reject at 15  ->   2.5% of spam refused,   0% of ham refused
#   reject at 12  ->  16.5%                    0%
#   reject at 10  ->  63.5%                    0%
#   reject at  8  ->  96.0%                    1.0%
#
# 8 catches almost everything and costs 1% of legitimate mail, which is the
# wrong trade for a mail server: refusing one in a hundred real messages is far
# more damaging than delivering spam someone can filter. 10 sits at the edge
# where ham loss is still zero.
#
# These numbers describe the trained classifier, not the code. Retrain with
# 'make rspamd-train' and they change — re-measure before trusting this.
reject = 10;
add_header = 6;
greylist = 4;
