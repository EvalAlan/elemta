# Greylisting off.
#
# Not because greylisting is a bad idea — it is a cheap and effective filter —
# but because nobody chose it here. It is a module that does nothing without a
# Redis backend, so giving Rspamd Redis for the Bayes classifier switched
# greylisting on as a side effect, and the dev stack started answering
# first-time senders with "soft reject".
#
# The symptom was not obviously greylisting. A stress run reported clean mail
# rejected and GTUBE spam accepted, which reads as a scanner wired backwards.
# What was actually happening: every message came from a triplet Rspamd had
# never seen, so it deferred them all with score 0, while GTUBE sailed through
# because reject_on_spam is false. A load test sends thousands of messages from
# new triplets and greylisting is designed to refuse exactly that, so the two
# are fundamentally at odds on a dev box.
#
# Turn it on deliberately if you want to test greylisting. Then expect the
# first attempt from each sender to get a 451, and expect stress numbers to
# mean something different.
enabled = false;
