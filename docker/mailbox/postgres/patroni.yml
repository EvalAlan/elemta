scope: elemta-mailbox-lab
namespace: /elemta/
restapi:
  listen: 0.0.0.0:8008
etcd3:
  hosts: etcd-a:2379,etcd-b:2379,etcd-c:2379
bootstrap:
  dcs:
    ttl: 20
    loop_wait: 5
    retry_timeout: 5
    maximum_lag_on_failover: 0
    synchronous_mode: quorum
    synchronous_mode_strict: true
    synchronous_node_count: 1
    postgresql:
      use_pg_rewind: true
      parameters:
        wal_level: replica
        hot_standby: 'on'
        max_wal_senders: 10
        max_replication_slots: 10
        wal_keep_size: 128MB
        shared_buffers: 256MB
        synchronous_commit: 'on'
  initdb:
    - encoding: UTF8
    - data-checksums
  post_bootstrap: /opt/patroni/bin/python /opt/bootstrap.py
postgresql:
  listen: 0.0.0.0:5432
  data_dir: /var/lib/postgresql/data/pgdata
  pgpass: /tmp/pgpass
  basebackup:
    checkpoint: fast
  pg_hba:
    - local all all trust
    - host all postgres 127.0.0.1/32 trust
    - host all postgres ::1/128 trust
    - host replication replicator 172.30.81.0/24 scram-sha-256
    - host all all 172.30.81.0/24 scram-sha-256
watchdog:
  # Container-loss tests only. Production needs independently verified fencing.
  mode: 'off'
